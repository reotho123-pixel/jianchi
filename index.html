<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>坚持</title>
<meta name="theme-color" content="#F6F6F4">
<meta name="description" content="英语 · 健身 · 戒撸，简单快速的打卡坚持工具">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="坚持">
<link rel="stylesheet" href="./fonts/lxgwwenkai-light.css">
<style>
@property --p{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F6F6F4;--ink:#1A1A1A;--muted:#9A9A94;--line:#E9E9E4;
  --soft:#2E2E2E;--white:#fff;
  --green:#DDEBCB;--purple:#DED8EF;--blue:#CFE0EF;
  --empty:#EDEDE8;--relapse:#E0A8A8;--amber:#C79A55;--restc:#8E8E86;
  --tabbar-h:66px;
}
html{-webkit-text-size-adjust:100%}
/* 禁止双指捏合缩放。viewport 的 user-scalable=no 在 iOS 上会被忽略，
   touch-action 才是真正生效的那层；双击放大交给 touch-action:manipulation。 */
html,body{touch-action:pan-x pan-y;overscroll-behavior:none}
/* 禁掉长按选中文字 / 长按弹出「拷贝·查询」气泡 / 长按元素被拎起来放大。
   这三样是 Safari 的行为，出现在 App 里就会「一看就是网页」。
   -webkit-touch-callout 管的正是气泡和"拎起来"，缺它光禁 user-select 不够。
   输入框必须单独开回来（见下方 input,textarea 那条）。 */
html,body{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input,textarea,select,[contenteditable]{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:default;
}
body{
  margin:0;background:radial-gradient(125% 58% at 50% 0%,#FCFCFA 0%,#F6F6F4 64%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"LXGW WenKai","Kaiti SC","STKaiti",KaiTi,"PingFang SC","Microsoft YaHei",serif;
  font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,h5,h6,b,strong,th,legend{font-weight:300}
button,input,textarea{font-family:inherit;font-weight:300;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:0;height:0}

#view{
  max-width:480px;margin:0 auto;
  /* 内容底部留出底栏高度；同样不再叠加 safe-area（理由见 #tabbar） */
  padding:20px 18px calc(var(--tabbar-h) + 30px);
  min-height:100vh;
}

/* ---------- 顶部（B 版：紧凑，无假状态栏） ---------- */
.topRow{display:flex;align-items:center;gap:12px;margin-bottom:12px;position:relative}
/* 今日页标题整行居中（左上角头像已去掉，直接居中即可） */
.topRow .tmain.ctr{flex:1;min-width:0;text-align:center}
.ava{width:42px;height:42px;border-radius:50%;background:var(--soft);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.tmain{flex:1;min-width:0}
.topr{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.icb.plus{background:var(--soft);color:#fff;font-size:21px;line-height:1}
.icb.bell{background:var(--purple);position:relative}
.icb.bell::after{content:"";position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--ink)}

.h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.4px}
.date{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sum{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.sum-n{font-size:26px;line-height:1;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.sum-n i{font-style:normal;font-size:15px;color:var(--muted)}
.sum-l{font-size:12.5px;color:var(--muted)}
.sum-l.done{color:var(--ink)}

/* ---------- 习惯卡 ---------- */
.card{
  position:relative;border-radius:26px;margin-bottom:20px;
  padding:18px 19px 17px;
  background:linear-gradient(142deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:0 6px 18px rgba(26,26,26,.075);
  border:1.5px dashed rgba(255,255,255,.88);
  transform:rotate(-.5deg);
}
.card.rr{transform:rotate(.55deg)}
.card:first-of-type{margin-top:6px}
/* 长按排序中的卡片：轻微抬起即可，不做位移动画
   transform 由 JS 每帧写入（含原倾斜角），CSS 里不要再设 transform，否则互相覆盖 */
.card.dragging{
  box-shadow:0 12px 26px rgba(26,26,26,.17);
  cursor:grabbing;
  position:relative;
}
body.dragging-card{touch-action:none;user-select:none;-webkit-user-select:none}
.card.excused{background:linear-gradient(142deg,#EDEDE8 0%,#F5F5F1 100%)}
.wm{position:absolute;right:-4px;top:-10px;font-size:56px;opacity:.16;transform:rotate(13deg);pointer-events:none;z-index:0}
.ctop{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:1}
.ic{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.88);font-size:20px;display:grid;place-items:center;box-shadow:0 3px 9px rgba(26,26,26,.07);transform:rotate(-3deg);flex:0 0 auto}
.cname{font-size:19.5px;line-height:1.3}
.cmeta{font-size:12.5px;color:rgba(26,26,26,.58);margin-top:4px}
.hl{position:relative;display:inline-block}
.hl::before{content:"";position:absolute;left:-3px;right:-3px;bottom:1px;height:11px;background:rgba(174,203,82,.42);border-radius:5px;z-index:-1}
.hl.p::before{background:rgba(156,143,208,.36)}
.hl.b::before{background:rgba(127,168,201,.36)}
.bignum{font-size:31px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap;position:relative;z-index:1}
.bignum em{font-style:normal;font-size:13.5px;color:rgba(26,26,26,.55)}

.pbar{height:9px;border-radius:99px;background:rgba(255,255,255,.72);margin-top:14px;overflow:hidden;position:relative;z-index:1}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--deep)}
.plabel{display:flex;justify-content:space-between;font-size:12px;color:rgba(26,26,26,.58);margin-top:8px;position:relative;z-index:1}

/* 七日条 */
.wk{display:flex;align-items:center;gap:5px;margin-top:13px;position:relative;z-index:1}
.wk i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.62);display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.wk i.on{background:var(--deep);box-shadow:none}
/* 完成型打卡在 last7() 里返回的是 done（不是 on），少这条规则七日条就不亮 */
.wk i.done{background:var(--deep);box-shadow:none}
.wk i.kept{background:var(--deep);box-shadow:none}
.wk i.rest{background:repeating-linear-gradient(48deg,#8E8E86 0 3.5px,#C4C4BC 3.5px 7px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.wk i.leave{background:repeating-linear-gradient(48deg,#C79A55 0 3.5px,#EBD9B8 3.5px 7px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.wk i.relapse{background:var(--relapse);box-shadow:none}
.wk i.today{box-shadow:inset 0 0 0 1.4px rgba(26,26,26,.28)}
.wk em{font-style:normal;font-size:10.5px;color:rgba(26,26,26,.45);margin-left:4px;white-space:nowrap}

/* 按钮 */
.btnrow{display:flex;gap:9px;margin-top:14px;position:relative;z-index:1}
.btnrow button{flex:1;padding:12px 0;border-radius:999px;font-size:13.5px;background:rgba(255,255,255,.8);box-shadow:0 2px 7px rgba(26,26,26,.055)}
.btnrow button:active{background:#fff}
.btnrow .wide{flex:1.42;background:#fff;box-shadow:0 3px 10px rgba(26,26,26,.075)}
.btnrow .ghost{background:rgba(255,255,255,.46);box-shadow:inset 0 0 0 1.3px rgba(255,255,255,.92)}
.btnrow button.dis{opacity:.42;cursor:not-allowed;background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1.3px rgba(255,255,255,.6)}
.btnrow.pad{padding-right:64px}

/* 印章 */
.stamp{
  position:absolute;right:16px;bottom:15px;width:52px;height:52px;border-radius:50%;
  border:1.7px dashed rgba(95,138,42,.6);color:#5F8A2A;display:grid;place-items:center;
  font-size:10px;line-height:1.2;text-align:center;transform:rotate(-13deg);
  background:rgba(255,255,255,.46);z-index:1;
}
.stamp.blue{border-color:rgba(70,130,170,.58);color:#4A7FA5}
.stamp.gray{border-color:rgba(26,26,26,.22);color:rgba(26,26,26,.42);font-size:9.5px}
.stamp.amber{border-color:rgba(160,115,50,.6);color:#96682A}

/* 休息日 / 请假 */
.excusechip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.9);border:1.3px dashed rgba(26,26,26,.2);margin-top:9px;position:relative;z-index:1;
}
.noteq{
  font-size:11.5px;color:rgba(26,26,26,.55);margin-top:9px;padding:7px 11px;border-radius:11px;
  background:rgba(255,255,255,.66);border-left:2.5px solid rgba(26,26,26,.14);position:relative;z-index:1;line-height:1.5;
}
.quotahint{
  font-size:11px;color:rgba(26,26,26,.5);margin-top:9px;position:relative;z-index:1;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.quotahint b{color:rgba(26,26,26,.72)}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(26,26,26,.18);display:block}
.dots i.used{background:#9C8FD0}
.dots i.usedL{background:#C79A55}
.dots i.usedR{background:#D9736F}

/* ---------- 统计卡 ---------- */
.sect{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:20px 2px 11px}
.sect::before{content:"";width:6px;height:6px;border-radius:50%;background:#C6DFA4}
.stats{display:flex;gap:11px}
.stat{
  flex:1;border-radius:22px;padding:15px;background:rgba(255,255,255,.95);
  box-shadow:0 5px 16px rgba(26,26,26,.07);border:1.4px dashed rgba(26,26,26,.09);
}
.stat.tint{background:linear-gradient(142deg,#DDEBCB,#EDF5E1)}
.stat-l{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.stat.tint .stat-l{color:rgba(26,26,26,.5)}
.stat-v{font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.stat-v span{font-size:12px;color:var(--muted);margin-left:3px}
.stat.tint .stat-v span{color:rgba(26,26,26,.5)}
.bars{display:flex;align-items:flex-end;gap:5px;height:30px;margin-bottom:8px}
.bars i{flex:1;border-radius:4px;background:#C6DFA4;display:block}
.bars i.off{background:#E9E9E4}
.bars i.rest{background:repeating-linear-gradient(48deg,#8E8E86 0 3.5px,#C4C4BC 3.5px 7px)}
.bars i.leave{background:repeating-linear-gradient(48deg,#C79A55 0 3.5px,#EBD9B8 3.5px 7px)}
.bars i.relapse{background:var(--relapse)}
.legend2{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:12px;justify-content:center;flex-wrap:wrap}
.legend2 span{display:flex;align-items:center;gap:5px}
.legend2 i{width:14px;height:6px;border-radius:99px;display:block}

/* ---------- 记录页 ---------- */
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative}
.rhead .rtitle{flex:1;text-align:center;font-size:19px}
.fpills{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
/* 选中项用真实布局放大（padding/字号），邻项才会真正被"挤开"让位；
   用 transform:scale 只改绘制尺寸，邻项不会动 */
.fpill{
  padding:7px 14px;border-radius:999px;background:var(--white);font-size:12.5px;white-space:nowrap;
  box-shadow:0 1px 4px rgba(26,26,26,.05);
  transition:padding .3s cubic-bezier(.22,1,.36,1),font-size .3s cubic-bezier(.22,1,.36,1),
             background .22s ease,color .22s ease,box-shadow .22s ease;
}
.fpill.on{
  padding:9px 18px;font-size:13.5px;
  background:var(--soft);color:#fff;box-shadow:none;
}
.fpico{font-size:1em;margin-right:4px;display:inline-block;vertical-align:-1px}
.calrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mpill{flex:1;display:flex;align-items:center;gap:9px;padding:7px 8px 7px 15px;border-radius:999px;background:var(--white);font-size:14px;font-variant-numeric:tabular-nums;min-width:0;box-shadow:0 2px 8px rgba(26,26,26,.05)}
.mpill .mico{flex:0 0 auto;color:var(--muted);display:grid;place-items:center}
.mpill .msp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpill .mnav{width:32px;height:32px;border-radius:50%;font-size:15px;color:var(--muted);flex:0 0 auto}
.mpill .mnav:disabled{opacity:.26}
.todaybtn{width:46px;height:46px;border-radius:50%;background:var(--soft);color:#fff;flex:0 0 auto;display:grid;place-items:center}
/* 日历本：月计划本 · 方格纸 */
.calwrap{
  position:relative;border-radius:18px;padding:16px 14px 18px;margin-top:10px;
  background-color:#FDFCF8;
  background-image:
    repeating-linear-gradient(0deg,rgba(110,145,180,.13) 0 1px,transparent 1px 15px),
    repeating-linear-gradient(90deg,rgba(110,145,180,.13) 0 1px,transparent 1px 15px);
  border:1px solid rgba(26,26,26,.07);
  box-shadow:0 5px 16px rgba(26,26,26,.07);
}
/* 笔记本索引标签 */
.caltab{
  position:absolute;right:-6px;top:22px;z-index:3;
  background:linear-gradient(142deg,#DDEBCB,#EDF5E1);color:#5F7A38;
  font-size:11.5px;padding:5px 11px 5px 13px;border-radius:0 8px 8px 0;
  box-shadow:2px 2px 7px rgba(26,26,26,.09);
}
.calhead2{display:flex;align-items:flex-end;gap:10px;padding:0 2px 12px}
.calhead2 .mnav{width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--muted);flex:0 0 auto}
.calhead2 .mnav:disabled{opacity:.26}
.calhead2 .mtitle{flex:1;min-width:0}
.calhead2 .mtitle .m{display:inline-block;position:relative;font-size:21px;letter-spacing:.5px}
.calhead2 .mtitle .m::after{
  content:"";position:absolute;left:-2px;right:-2px;bottom:1px;height:8px;
  background:rgba(174,203,82,.34);border-radius:4px;z-index:-1;transform:rotate(-.6deg);
}
.calhead2 .mtitle .y{font-size:12px;color:var(--muted);margin-left:8px}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.calwk span{text-align:center;font-size:11px;color:var(--muted)}
.calwk span.we{color:#C9907C}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ccell{
  position:relative;aspect-ratio:1;border-radius:9px;background:transparent;
  display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums;
}
.ccell.blank{background:none}
.ccell.future{opacity:.3}
.ccell.today{background:rgba(174,203,82,.16);box-shadow:inset 0 0 0 1.3px rgba(140,170,70,.5)}
.ccell.today .cn{color:#4E6A22}
.ccell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ccell.today.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ccell.we .cn{color:#C9907C}
.ccell .cn{position:relative;z-index:2}
/* 打卡成功的日期：整格实心色块 + 白字（显眼） */
.ccell .cfill{
  position:absolute;inset:0;border-radius:9px;display:block;
  z-index:1;box-shadow:0 1px 3px rgba(26,26,26,.16);
}
.ccell.done .cn{color:#fff}
.ccell.done.we .cn{color:#fff}
.ccell.done.today{background:rgba(174,203,82,.16)}
/* 补打标记：右上角小三角，一眼能看出是补的 */
.ccell .bk{
  position:absolute;top:0;right:0;width:0;height:0;z-index:3;
  border-top:11px solid rgba(26,26,26,.55);
  border-left:11px solid transparent;
  border-top-right-radius:9px;
}
.cellstriped{background:repeating-linear-gradient(48deg,#E4E4DE 0 4px,#EFEFEA 4px 8px) !important}
.cellstriped.leave{background:repeating-linear-gradient(48deg,#EBD9B8 0 4px,#F5EDDC 4px 8px) !important}
.cellstriped.rest{background:repeating-linear-gradient(48deg,#DCDCD6 0 4px,#EDEDE8 4px 8px) !important}
.calhint{margin-top:13px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.65}
.calmore{margin-top:12px;text-align:center}
.linkbtn{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}
.linkbtn:active{color:var(--ink)}
.dcard{position:relative;border-radius:26px;padding:19px 20px 23px;margin-top:20px;background:var(--green);border:1.4px dashed rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(26,26,26,.07)}
.dchead{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;padding:0 2px}
.dchead .dct{flex:1;font-size:16.5px}
.dchead .dcn{font-size:12.5px;color:rgba(26,26,26,.55);font-variant-numeric:tabular-nums}
.drow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:17px;background:rgba(255,255,255,.7)}
.drow .dico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--hicon);flex:0 0 auto}
.drow .dmain{flex:1;min-width:0}
.drow .dnm{display:block;font-size:13.5px}
.drow .dst{display:block;font-size:11.5px;color:rgba(26,26,26,.5);margin-top:2px;font-variant-numeric:tabular-nums}
.drow .dact{font-size:12px;padding:7px 12px;border-radius:999px;background:#fff;flex:0 0 auto}
.drow .dact.off{opacity:.35}
.statcard{background:linear-gradient(142deg,#DDEBCB,#EDF5E1);border-radius:24px;padding:18px;margin-top:16px;border:1.4px dashed rgba(255,255,255,.9);box-shadow:0 5px 16px rgba(26,26,26,.06)}
.srow{display:flex;text-align:center}
.srow>div{flex:1;min-width:0}
.srow>div+div{border-left:1px solid rgba(26,26,26,.1)}
.srow b{display:block;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.srow b em{font-style:normal;font-size:13px;color:rgba(26,26,26,.5)}
.srow span{display:block;font-size:11.5px;color:rgba(26,26,26,.5);margin-top:7px}
.srow2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-top:15px;padding-top:14px;border-top:1px solid rgba(26,26,26,.1);color:rgba(26,26,26,.5);flex-wrap:wrap}
.srow2 b{color:var(--ink);font-variant-numeric:tabular-nums}
.msum{margin-top:14px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.msum b{color:var(--ink)}

/* ---------- 我的页 ---------- */
.list{background:rgba(255,255,255,.95);border-radius:24px;overflow:hidden;border:1.4px dashed rgba(26,26,26,.09);box-shadow:0 5px 16px rgba(26,26,26,.06)}
.lrow{display:flex;align-items:center;gap:13px;padding:16px 18px;width:100%;text-align:left}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .lico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:var(--cardbg)}
.lrow .lmain{flex:1;min-width:0}
.lrow .lname{display:block;font-size:15.5px}
.lrow .lsub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.lrow .larr{font-size:13px;color:var(--muted);flex:0 0 auto}
.lrow .lup{display:flex;gap:4px;flex:0 0 auto}
.lrow .lup button{width:30px;height:30px;border-radius:50%;background:rgba(26,26,26,.05);font-size:13px;color:var(--muted)}
.lrow .lup button:disabled{opacity:.3}

<script>
/* 禁掉双指捏合缩放。加进主屏后还能捏小的话，露出的白边会让人一眼看出是网页。
   viewport 的 user-scalable=no 在 iOS 上基本被忽略，真正管用的是这两条：
     - gesturestart/change/end 是 iOS Safari 专有事件，拦掉即可
     - touchmove 里判断多指兜底（部分 WebView 不发 gesture 事件）
   注意：双击放大交给 CSS 的 touch-action:manipulation，
   千万别在 touchend 里 preventDefault —— 那会把后续 click 一起吃掉，按钮全点不动。
   iOS「辅助功能 → 缩放」的三指手势是系统级，网页拦不住也不该拦。 */
(function lockZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });
})();

/* ============================================================
   工具
   ============================================================ */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); }
function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
var CN_MONTH = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
function fmtDate(iso) { var d = parseISO(iso); return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()]; }
function fmtDateShort(iso) { var d = parseISO(iso); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function fmtMin(n) {
  if (!n) return '0 分钟';
  if (n < 60) return n + ' 分钟';
  var h = Math.floor(n / 60), m = n % 60;
  return m ? h + ' 小时 ' + m + ' 分' : h + ' 小时';
}
function hoursText(min) {
  if (!min) return '0';
  var hh = min / 60;
  if (hh < 10) { var v = Math.round(hh * 10) / 10; return (v % 1 === 0 ? String(v) : v.toFixed(1)); }
  return String(Math.round(hh));
}
/* 所在周的周一 */
function weekStartOf(iso) {
  var d = parseISO(iso);
  var off = (d.getDay() + 6) % 7;
  return addDays(iso, -off);
}

/* ============================================================
   数据
   ============================================================ */
var KEY = 'jianchi-v1';
var QUOTA_MAX = 3;   /* 每周休息日 / 请假各最多 3 天 */
var RELAPSE_FREE = 1;         /* 每自然月允许 1 次破戒不重算连续；从第 2 次起从破戒日重新起算 */
var RELAPSE_CAL = '#D9736F';  /* 日历上「破戒」的填充红 */
var PALETTE = {
  green:  { bg: '#DDEBCB', c2: '#EDF5E1', deep: '#8FB55C', ring: '#BEDD94', cal: '#6E9440' },
  purple: { bg: '#DED8EF', c2: '#EBE8F7', deep: '#9C8FD0', ring: '#BBA8E8', cal: '#7A6BB8' },
  blue:   { bg: '#CFE0EF', c2: '#E1EDF6', deep: '#7FA8C9', ring: '#93C6EA', cal: '#5E8CB0' },
  pink:   { bg: '#F3DCE2', c2: '#FAEFF2', deep: '#CE8CA0', ring: '#EDB4C6', cal: '#B56880' },
  orange: { bg: '#F7E4CE', c2: '#FCF2E4', deep: '#D0A26A', ring: '#EEC79A', cal: '#AD7A3E' },
  teal:   { bg: '#CFE7E2', c2: '#E4F2EF', deep: '#79B3A8', ring: '#A2D3C9', cal: '#538F84' },
  yellow: { bg: '#F5EEC9', c2: '#FAF6E1', deep: '#C9B85E', ring: '#E7D992', cal: '#A89440' },
  gray:   { bg: '#E6E6E2', c2: '#F1F1EE', deep: '#A3A39B', ring: '#D0D0C9', cal: '#7E7E76' }
};
var ICONS = ['📖','💪','🛡️','🏃','🧘','💧','🥗','📝','🎯','🎸','🌙','☀️','🚭','🍎','🧹','💊'];
var LEAVE_REASONS = ['加班', '身体不适', '外出', '家中有事'];

function defaultState() {
  var t = todayISO();
  return {
    version: 1,
    habits: [
      { id: 'en',    name: '英语', icon: '📖', color: 'green',  type: 'check',   goalMinutes: 30, sort: 0, builtin: true, archived: false, createdAt: t, allowRest: false, allowLeave: true },
      { id: 'fit',   name: '健身', icon: '💪', color: 'purple', type: 'check',   goalMinutes: 40, sort: 1, builtin: true, archived: false, createdAt: t, allowRest: true,  allowLeave: false },
      { id: 'nofap', name: '戒撸', icon: '🛡️', color: 'blue',   type: 'abstain', goalMinutes: 0,  sort: 2, builtin: true, archived: false, createdAt: t, allowRest: false, allowLeave: false }
    ],
    records: {},
    settings: { lastBackupAt: null, createdAt: t }
  };
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !d.habits || !d.records) return null;
    if (!d.settings) d.settings = { lastBackupAt: null, createdAt: todayISO() };
    /* 兼容旧数据：补上 allowRest / allowLeave 字段 */
    d.habits.forEach(function (h) {
      if (typeof h.allowRest === 'undefined') h.allowRest = (h.id === 'fit');
      if (typeof h.allowLeave === 'undefined') h.allowLeave = (h.id === 'en');

  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('保存失败，存储空间可能已满'); }
}
var S = load() || defaultState();

function activeHabits() { return S.habits.filter(function (h) { return !h.archived; }).sort(function (a, b) { return a.sort - b.sort; }); }
function habitById(id) { return S.habits.filter(function (h) { return h.id === id; })[0]; }
function recOf(hid, d) { return (S.records[hid] || {})[d]; }
function setRec(hid, d, rec) { if (!S.records[hid]) S.records[hid] = {}; S.records[hid][d] = rec; }
function delRec(hid, d) { if (S.records[hid]) delete S.records[hid][d]; }

/* 记录状态：完成型 status = done | rest | leave（缺省为 done）；戒断型 status = kept | relapse */
function recStatus(h, r) {
  if (!r) return null;
  if (h.type === 'abstain') return r.status === 'relapse' ? 'relapse' : 'kept';
  return (r.status === 'rest' || r.status === 'leave') ? r.status : 'done';

function isExcused(r) { return !!r && (r.status === 'rest' || r.status === 'leave'); }

   从第 RELAPSE_FREE+1 次起，连续天数从破戒当天重新起算。
   只影响「连续/最长连续」的算法，绝不删改任何历史记录。 */
function isRelapse(r) { return !!r && r.status === 'relapse'; }
/* 本月已破戒次数 */
function relapseUsed(hid) {
  var ym = todayISO().slice(0, 7);
  var log = S.records[hid] || {}, n = 0;
  for (var d in log) if (d.slice(0, 7) === ym && isRelapse(log[d])) n++;

/* 这一天是否是「计中断」的破戒（本月超出免费额度的那几次）
   注意：按当月破戒日期升序的序号判定，删掉靠前的一次会让后面的序号前移 */
function isBreakingRelapse(hid, iso) {
  var ym = iso.slice(0, 7);
  var log = S.records[hid] || {};
  var dates = Object.keys(log).filter(function (d) {
    return d.slice(0, 7) === ym && isRelapse(log[d]);
  }).sort();
  return dates.indexOf(iso) >= RELAPSE_FREE;

function isDone(h, d) {
  var r = recOf(h.id, d);
  if (!r) return false;
  if (h.type === 'abstain') return r.status === 'kept' || !isBreakingRelapse(h.id, d);
  return !isExcused(r);
}

/* 戒断型的起点：创建日，或更早的补打记录日（补打说明那天其实也坚持了） */
function abstainStart(h) {
  var log = S.records[h.id] || {};
  var dates = Object.keys(log).sort();
  var start = h.createdAt || todayISO();
  if (dates.length && dates[0] < start) start = dates[0];
  return start;
}
function streak(h) {
  var t = todayISO();
  if (h.type === 'abstain') {
    var log = S.records[h.id] || {};
    /* 只统计「计中断」的破戒：每月第 1 次破戒不算中断，第 2 次起才重新起算 */
    var breaks = Object.keys(log).filter(function (d) {
      return isRelapse(log[d]) && isBreakingRelapse(h.id, d);
    }).sort();
    var last = breaks.length ? breaks[breaks.length - 1] : null;
    /* 首次破戒不中断；超额度的那次从「破戒日当天」重新起算（当天算第 1 天） */
    var start = last ? last : abstainStart(h);
    if (start > t) return 0;
    return diffDays(start, t) + 1;
  }
  /* 完成型：休息日 / 请假不计数也不中断 */
  var day = t, n = 0, guard = 0;
  if (!recOf(h.id, day)) day = addDays(day, -1);
  while (guard++ < 3650) {
    var r = recOf(h.id, day);
    if (!r) break;
    if (!isExcused(r)) n++;
    day = addDays(day, -1);
  }
  return n;
}
function bestStreak(h) {
  var log = S.records[h.id] || {};
  var dates = Object.keys(log).sort();
  if (!dates.length) return 0;
  if (h.type === 'abstain') {
    /* 只有「计中断」的破戒才切分段；每月第 1 次破戒不影响最长连续 */
    var rel = dates.filter(function (d) {
      return isRelapse(log[d]) && isBreakingRelapse(h.id, d);
    });
    var start = abstainStart(h);
    var best = 0, prev = start;
    rel.forEach(function (d) {
      var len = diffDays(prev, d) + 1;      /* 到破戒日当天为止（含当天） */
      if (len > best) best = len;
      prev = d;                             /* 下一段从破戒日当天起算 */
    });
    if (prev <= todayISO()) {
      var len2 = diffDays(prev, todayISO()) + 1;
      if (len2 > best) best = len2;
    }
    return best;
  }
  var t = todayISO();
  var best2 = 0, run = 0;
  var d2 = dates[0];
  var guard = 0;
  while (d2 <= t && guard++ < 7300) {
    var r = log[d2];
    if (r) {
      if (!isExcused(r)) run++;
    } else if (d2 !== t) {
      run = 0;
    }
    if (run > best2) best2 = run;
    d2 = addDays(d2, 1);
  }
  return best2;
}
function relapseCount(h) {
  var log = S.records[h.id] || {}, n = 0;
  for (var d in log) if (log[d].status === 'relapse') n++;
  return n;
}
function totalDays(h) {
  var log = S.records[h.id] || {}, n = 0;
  for (var d in log) if (!isExcused(log[d])) n++;
  return n;
}
function totalMinutes(h) {
  var log = S.records[h.id] || {}, n = 0;
  for (var d in log) n += (log[d].minutes || 0);
  return n;
}
function lastMinutes(hid) {
  var log = S.records[hid] || {};
  var ds = Object.keys(log).filter(function (d) { return typeof log[d].minutes === 'number'; }).sort();
  return ds.length ? log[ds[ds.length - 1]].minutes : null;
}
function monthStats(h, y, m) {
  var days = new Date(y, m + 1, 0).getDate();
  var td = parseISO(todayISO());
  var elapsed = (y === td.getFullYear() && m === td.getMonth()) ? td.getDate() : days;
  var done = 0, mins = 0, excused = 0;
  for (var d = 1; d <= days; d++) {
    var iso = isoOf(new Date(y, m, d));
    var r = recOf(h.id, iso);
    if (!r) continue;
    if (h.type === 'abstain') { if (r.status === 'kept') done++; }
    else if (isExcused(r)) { excused++; }
    else { done++; mins += (r.minutes || 0); }
  }
  var base = Math.max(1, elapsed - excused);
  return { done: done, mins: mins, elapsed: elapsed, excused: excused, rate: Math.round(done / base * 100) };
}
function weekStats() {
  var t = todayISO();
  var ws = weekStartOf(t);
  var hs = activeHabits(), days = 0;
  for (var i = 0; i < 7; i++) {
    var iso = addDays(ws, i);
    if (iso > t) break;
    if (hs.some(function (h) { return isDone(h, iso); })) days++;
  }
  return { days: days, start: ws };
}
/* 本周某习惯已用掉的休息日 / 请假天数 */
function quotaUsed(hid, kind) {
  var ws = weekStartOf(todayISO());
  var log = S.records[hid] || {}, n = 0;
  for (var i = 0; i < 7; i++) {
    var r = log[addDays(ws, i)];
    if (r && r.status === kind) n++;
  }
  return n;
}
/* 近 7 天（含今天）各天的状态，用于七日条 */
function last7(h) {
  var t = todayISO(), out = [];
  for (var i = 6; i >= 0; i--) {
    var d = addDays(t, -i);
    var r = recOf(h.id, d);
    var kind = 'off';
    if (r) {
      var st = recStatus(h, r);
      /* 完成型的 'done' 与戒断型的 'kept' 都是「这天完成了」，统一成 on，
         否则 CSS 只认 .on，完成型的七日条永远不亮 */
      kind = (st === 'kept' || st === 'done') ? 'on' : st;
    }
    out.push({ d: d, kind: kind, today: d === t });
  }
  return out;
}
/* 本周各天（周一起）的状态，用于统计柱状图 */
function weekBar() {
  var t = todayISO(), ws = weekStartOf(t), out = [];
  var hs = activeHabits();
  for (var i = 0; i < 7; i++) {
    var d = addDays(ws, i);
    var kind = 'off';
    if (d <= t) {
      var kinds = hs.map(function (h) {
        var r = recOf(h.id, d);
        return r ? recStatus(h, r) : null;
      }).filter(Boolean);
      if (kinds.indexOf('done') >= 0 || kinds.indexOf('kept') >= 0) kind = 'on';
      else if (kinds.indexOf('leave') >= 0) kind = 'leave';
      else if (kinds.indexOf('rest') >= 0) kind = 'rest';
      else if (kinds.indexOf('relapse') >= 0) kind = 'relapse';
    }
    out.push({ d: d, kind: kind, future: d > t });
  }
  return out;
}

/* ============================================================
   形变动效（A 版）：面板从被点按钮的形状和位置长出来
   ============================================================ */
var MORPH_DUR = 620;
var MORPH_EASE = 'cubic-bezier(.22,.9,.24,1)';

/* 找到触发这次弹层的按钮，返回它在屏幕上的位置 */
function sourceRect(el) {
  var src = el || window.__lastTap || null;
  if (!src || !src.getBoundingClientRect) return null;
  var r = src.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  return r;
}
/* 记录最后一次点击的按钮（事件委托里拿不到时兜底） */
document.addEventListener('pointerdown', function (e) {
  var t = e.target && e.target.closest ? e.target.closest('button') : null;
  if (t) window.__lastTap = t;
}, true);

/* 播放形变：sheet 从按钮位置/尺寸/圆角 变到 最终位置/尺寸/圆角 */
function morphIn(sheet, mask, inner, srcEl) {
  var sr = sourceRect(srcEl);
  var tr = sheet.getBoundingClientRect();          /* 最终位置（已在 DOM 中） */
  var from = null;
  if (sr) {
    from = {
      transform: 'translate(' + (sr.left - tr.left) + 'px,' + (sr.top - tr.top) + 'px)',
      width: sr.width + 'px',
      height: sr.height + 'px',
      borderRadius: '999px',
      opacity: .5
    };
  } else {
    from = { transform: 'translateY(90px) scale(.94)', opacity: 0, borderRadius: '34px 34px 0 0' };
  }
  var to = {
    transform: 'translate(0,0)',
    width: tr.width + 'px',
    height: tr.height + 'px',
    borderRadius: '30px 30px 0 0',
    opacity: 1
  };
  /* 面板尺寸从按钮尺寸长到最终尺寸；用固定定位保证左上角锚点不漂 */
  sheet.style.visibility = 'visible';
  var a1 = sheet.animate([from, to], { duration: MORPH_DUR, easing: MORPH_EASE, fill: 'both' });
  var a2 = mask.animate([{ opacity: 0 }, { opacity: 1 }], { duration: MORPH_DUR, easing: 'ease-out', fill: 'both' });
  var a3 = inner ? inner.animate([
    { opacity: 0, transform: 'translateY(14px)' },
    { opacity: 0, transform: 'translateY(14px)', offset: .62 },
    { opacity: 1, transform: 'translateY(0)' }
  ], { duration: MORPH_DUR, easing: 'ease-out', fill: 'both' }) : null;
  return [a1, a2, a3].filter(Boolean);
}
/* 反向：原路收回到按钮 */
function morphOut(sheet, mask, inner, srcEl, done) {
  var anims = [];
  var sr = sourceRect(srcEl);
  var tr = sheet.getBoundingClientRect();
  var to = sr
    ? { transform: 'translate(' + (sr.left - tr.left) + 'px,' + (sr.top - tr.top) + 'px)',
        width: sr.width + 'px', height: sr.height + 'px', borderRadius: '999px', opacity: .4 }
    : { transform: 'translateY(90px) scale(.94)', opacity: 0 };
  anims.push(sheet.animate([
    { transform: 'translate(0,0)', width: tr.width + 'px', height: tr.height + 'px',
      borderRadius: '30px 30px 0 0', opacity: 1 },
    to
  ], { duration: 420, easing: 'cubic-bezier(.4,0,.7,.3)', fill: 'both' }));
  anims.push(mask.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: 'ease-in', fill: 'both' }));
  if (inner) anims.push(inner.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: 'ease-in', fill: 'both' }));
  /* 用 finished promise 收尾：onfinish 里再 cancel 会变成 oncancel，回调不触发 */
  var main = anims[0];
  var finish = function () {
    sheet.style.visibility = 'hidden';
    if (done) done();
  };
  if (main.finished && main.finished.then) {
    main.finished.then(finish).catch(finish);
  } else {
    main.onfinish = finish;
  }
  return anims;
}

function confirmDlg(title, body, okText, onOk, danger) {
  var root = $('#sheetRoot');
  var wrap = document.createElement('div');
  wrap.innerHTML =
    '<div class="mask show" data-close="1"></div>' +
    '<div class="dlg show"><h3>' + esc(title) + '</h3><p>' + body + '</p>' +
    '<div class="dacts"><button data-close="1">取消</button>' +
    '<button class="' + (danger ? 'danger' : 'pbtn') + '" data-ok="1">' + esc(okText) + '</button></div></div>';
  root.appendChild(wrap);

    var m = wrap.querySelector('.mask'), d = wrap.querySelector('.dlg');

function habitCard(h, d, idx) {

  var st = streak(h);
  var status = recStatus(h, r);
  var isToday = (d === todayISO());
  var cls = 'card' + (idx % 2 === 1 ? ' rr' : '') + (isExcused(r) ? ' excused' : '');
  var style = isExcused(r) ? '' : ' style="' + cardStyle(h) + '"';

    '<div class="wm">' + h.icon + '</div>';

  /* ---- 上排 ---- */

  if (h.type === 'abstain') {
    right = '<div class="bignum">' + st + '<em> 天</em></div>';
    var ru = relapseUsed(h.id);
    var over = ru > RELAPSE_FREE;
    meta = '最长 ' + bestStreak(h) + ' 天 · 累计破戒 ' + relapseCount(h) + ' 次 · ' +
      (over ? '本月已用满 ' + RELAPSE_FREE + ' 次免费额度' : '本月已用 ' + ru + '/' + RELAPSE_FREE + ' 次免费额度');
    wkCls = 'b';

  } else if (status === 'done') {
    var m = r.minutes || 0;

      (goal > 0 ? ' · 目标 ' + goal + ' 分钟' : '');
  } else {
    right = '<div class="bignum">0<em>' + (goal > 0 ? ' / ' + goal : ' 分') + '</em></div>';
    meta = '连续 <span class="hl' + (h.color === 'purple' ? ' p' : (h.color === 'blue' ? ' b' : '')) + '">' + st + ' 天</span>' +

    '<div style="flex:1;min-width:0"><div class="cname">' + esc(h.name) + '</div>' +
    '<div class="cmeta">' + meta + '</div></div>' + right + '</div>';

    /* 无进度条 */

    out += '<div class="quotahint">本周休息日 ' + quotaDots(ru, 'rest') + ' <b>' + ru + ' / ' + QUOTA_MAX + '</b> 天' +
      (ru >= QUOTA_MAX ? ' · 已用满，下周一重置' : '') + '</div>';
    out += '<div class="stamp gray">休息<br>不中断</div>';

      '<button data-act="cancelExcuse" data-hid="' + h.id + '" data-date="' + d + '">取消请假</button></div>';
    out += '<div class="quotahint">本周请假 ' + quotaDots(lu, 'leave') + ' <b>' + lu + ' / ' + QUOTA_MAX + '</b> 天' +
      (lu >= QUOTA_MAX ? ' · 已用满，下周一重置' : '') + '</div>';
    out += '<div class="stamp amber">请假<br>不计入</div>';
  } else if (status === 'done') {
    var metGoal = goal > 0 && (r.minutes || 0) >= goal;
    var btns3 = '<button data-act="edit" data-hid="' + h.id + '" data-date="' + d + '">改时长</button>';

      btns3 += '<button data-act="rest" data-hid="' + h.id + '" data-date="' + d + '">改休息日</button>';
    }

    }
    btns3 += '<button data-act="undo" data-hid="' + h.id + '" data-date="' + d + '">撤销</button>';
    out += '<div class="btnrow' + (metGoal ? ' pad' : '') + '">' + btns3 + '</div>';
    if (metGoal) out += '<div class="stamp">已<br>达标</div>';
  } else {
    var ru2 = quotaUsed(h.id, 'rest'), lu2 = quotaUsed(h.id, 'leave');
    var btns = '<button class="wide" data-act="checkin" data-hid="' + h.id + '" data-date="' + d + '">打卡</button>';
    if (h.allowLeave) {
      btns += '<button' + (lu2 >= QUOTA_MAX ? ' class="dis"' : ' data-act="leave" data-hid="' + h.id + '" data-date="' + d + '"') +
        '>请假</button>';
    }
    if (h.allowRest) {
      btns += '<button' + (ru2 >= QUOTA_MAX ? ' class="dis"' : ' data-act="rest" data-hid="' + h.id + '" data-date="' + d + '"') +

    if (h.allowRest || h.allowLeave) {
      var qs = [];
      if (h.allowRest) qs.push('休息日 ' + quotaDots(ru2, 'rest') + ' <b>' + ru2 + ' / ' + QUOTA_MAX + '</b>');
      if (h.allowLeave) qs.push('请假 ' + quotaDots(lu2, 'leave') + ' <b>' + lu2 + ' / ' + QUOTA_MAX + '</b>');
      out += '<div class="quotahint">本周 ' + qs.join('　') + '</div>';
    }
  }
  return out + '</div>';
}

  /* 本周统计 */
  var wb = weekBar();
  h += '<div class="sect">本周</div><div class="stats">' +
    '<div class="stat"><div class="stat-l">打卡天数</div>' +
    '<div class="bars">' + wb.map(function (x) {
      return '<i class="' + (x.future ? 'off' : x.kind) + '" style="height:' + (x.future ? 30 : 100) + '%"></i>';
    }).join('') + '</div>' +
    '<div class="stat-v">' + w.days + '<span>天</span></div></div>' +
    '<div class="stat tint"><div class="stat-l">累计时长</div>' +
    '<div class="stat-v">' + hoursText(hs.reduce(function (a, x) { return a + totalMinutes(x); }, 0)) + '<span>小时</span></div></div>' +
    '</div>';
  h += '<div class="legend2">' +
    '<span><i style="background:#C6DFA4"></i>已打卡</span>' +

/* ============================================================
   记录页
   ============================================================ */
var recView = { hid: 'all', y: 0, m: 0, sel: null };
function cellInfo(hid, iso) {
  var h = habitById(hid);
  if (!h) return { slots: [], total: 0, back: false, striped: null, done: false };
  var r = recOf(h.id, iso);
  if (!r) return { slots: [], total: 0, back: false, striped: null, done: false };
  var back = !!r.backfilled;
  var st = recStatus(h, r);
  if (st === 'rest') return { slots: [], total: 0, back: back, striped: 'rest', done: false, tone: null };
  if (st === 'leave') return { slots: [], total: 0, back: back, striped: 'leave', done: false, tone: null };
  /* 破戒：整格红填充（显眼）。超出月度额度的用深一档红以示区别 */
  if (st === 'relapse') {
    var breaking = isBreakingRelapse(h.id, iso);
    return { slots: [], total: 0, back: back, striped: null, done: true,
             tone: breaking ? '#C0504C' : RELAPSE_CAL, relapse: true };
  }
  /* 打卡成功（戒断型的「坚持住了」也算）→ 给一个显眼的实心色块 */
  var tone = (PALETTE[h.color] || PALETTE.green).cal;
  return { slots: [], total: 0, back: back, striped: null, done: true, tone: tone };
}
function dayDetail(iso) {
  var t = todayISO();
  var h = habitById(recView.hid);
  if (!h) return '';
  var canBack = iso < t && diffDays(iso, t) <= 7;
  var r = recOf(h.id, iso);
  var status = recStatus(h, r);
  var sub, act = '';
  if (h.type === 'abstain') {
    sub = r ? (status === 'kept' ? '坚持住了'
      : (isBreakingRelapse(h.id, iso) ? '破戒 · 连续已重算' : '破戒 · 连续不中断')) : '未记录';
  } else if (status === 'rest') {
    sub = '休息日 · 连续不中断';
  } else if (status === 'leave') {
    sub = '请假' + (r.leaveReason ? ' · ' + r.leaveReason : '');
  } else {
    sub = r ? (r.minutes != null ? r.minutes + ' 分钟' : '已打卡（未记时长）') : '未记录';
  }
  if (r && r.backfilled) sub += ' · 补打';
  if (r) {
    act = '<button data-act="dayEdit" data-hid="' + h.id + '" data-date="' + iso + '">改</button>' +
          '<button data-act="dayDel" data-hid="' + h.id + '" data-date="' + iso + '">删</button>';
  } else if (canBack) {
    if (h.type === 'abstain') {
      act = '<button data-act="dayKeep" data-hid="' + h.id + '" data-date="' + iso + '">坚持</button>' +
            '<button data-act="dayRelapse" data-hid="' + h.id + '" data-date="' + iso + '">破戒</button>';
    } else {
      act = '<button data-act="dayBack" data-hid="' + h.id + '" data-date="' + iso + '">补打</button>';
      if (h.allowRest) act += '<button data-act="dayRest" data-hid="' + h.id + '" data-date="' + iso + '">休息</button>';
      if (h.allowLeave) act += '<button data-act="dayLeave" data-hid="' + h.id + '" data-date="' + iso + '">请假</button>';
    }
  } else {
    act = '<button class="off" disabled>—</button>';
  }
  var note = (r && r.note) ? '<div class="noteq" style="background:rgba(255,255,255,.6)">「' + esc(r.note) + '」</div>' : '';
  return '<div class="dcard"><div class="dchead"><span class="dct">' + h.icon + ' ' + esc(h.name) + '</span>' +
    '<span class="dcn">' + (iso === t ? '今天' : fmtDateShort(iso)) + ' · ' +
    (iso === t ? '今日记录' : (canBack ? '可补打' : '超过 7 天')) + '</span></div>' +
    '<div class="drow" style="--hicon:' + (PALETTE[h.color] || PALETTE.green).bg + '">' +
    '<span class="dico">' + h.icon + '</span>' +
    '<span class="dmain"><span class="dnm">' + esc(h.name) + '</span><span class="dst">' + sub + '</span></span>' +
    '<span class="dacts">' + act + '</span></div>' + note + '</div>';
}
function renderRecords() {
  var t = todayISO(), td = parseISO(t);
  if (!recView.y) { recView.y = td.getFullYear(); recView.m = td.getMonth(); }
  if (!recView.sel) recView.sel = t;
  var hs = activeHabits();
  /* 「全部」视图已移除：筛选始终落在某个具体习惯上（默认第一个） */
  if (!hs.length) recView.hid = null;
  else if (recView.hid === 'all' || !hs.some(function (x) { return x.id === recView.hid; })) recView.hid = hs[0].id;
  if (!hs.length) {
    /* 兜底：习惯全被归档时，原版会在这里崩（monthStats(undefined)），记录页白屏 */
    return '<div class="rhead"><div class="rtitle">打卡记录</div></div>' +
      '<div class="empty">没有可看的打卡项<br>去「我的」新建一个，或用「导入数据」恢复备份</div>';
  }
  var y = recView.y, m = recView.m;
  var isCurMonth = (y === td.getFullYear() && m === td.getMonth());
  var sel = recView.sel;
  if (sel && (parseISO(sel).getFullYear() !== y || parseISO(sel).getMonth() !== m)) sel = null;

  var h = '<div class="rhead"><div class="rtitle">打卡记录</div></div>';

  h += '<div class="fpills">' +
    hs.map(function (x) {
      return '<button class="fpill' + (recView.hid === x.id ? ' on' : '') + '" data-act="pick" data-hid="' + x.id + '">' +
        '<span class="fpico">' + x.icon + '</span>' + esc(x.name) + '</button>';
    }).join('') + '</div>';

  /* 日历本：标题（荧光笔下划线）+ 索引标签 */
  h += '<div class="calwrap">' +
    '<div class="caltab">' + (m + 1) + '月</div>' +
    '<div class="calhead2">' +
    '<button class="mnav" data-act="prev">‹</button>' +
    '<div class="mtitle"><span class="m">' + CN_MONTH[m] + '</span><span class="y">' + y + '</span></div>' +
    '<button class="mnav" data-act="next"' + (isCurMonth ? ' disabled' : '') + '>›</button>' +
    '</div>';

  /* 日历 */
  var first = new Date(y, m, 1);
  var off = (first.getDay() + 6) % 7;
  var days = new Date(y, m + 1, 0).getDate();
  var cells = '';
  for (var i = 0; i < off; i++) cells += '<span class="ccell blank"></span>';
  for (var d = 1; d <= days; d++) {
    var iso = isoOf(new Date(y, m, d));
    var future = iso > t;
    var dow = (off + d - 1) % 7;   /* 0=一 … 5=六 6=日 */
    var ci = cellInfo(recView.hid, iso);
    var cls = 'ccell' + (future ? ' future' : '') + (iso === t ? ' today' : '') +
              (iso === sel ? ' sel' : '') + (dow >= 5 ? ' we' : '');
    if (ci.striped) cls += ' cellstriped ' + ci.striped;
    /* 打卡成功：整格实心色块（比细环显眼得多），补打的再加右上角小三角 */
    var fill = '';
    if (ci.done && ci.tone) {
      cls += ' done' + (ci.relapse ? ' relapse' : '');
      fill = '<i class="cfill" style="background:' + ci.tone + '"></i>';
    }
    cells += '<button class="' + cls + '" data-act="day" data-date="' + iso + '"' +
      (future ? ' disabled' : '') + '>' + fill + '<span class="cn">' + d + '</span>' +
      (ci.back ? '<i class="bk" title="补打"></i>' : '') + '</button>';
  }
  h += '<div class="calwrap"><div class="calwk">' + ['一','二','三','四','五','六','日'].map(function (w) { return '<span>' + w + '</span>'; }).join('') +
       '</div><div class="cgrid">' + cells + '</div>';

  {
    var hh = habitById(recView.hid);
    var doneColor = (PALETTE[(hh && hh.color) || 'green'] || PALETTE.green).cal;
    var lg = (hh && hh.type === 'abstain')
      ? [['#93C6EA', '坚持住了'], [RELAPSE_CAL, '破戒（不中断）'], ['#C0504C', '破戒（连续重算）'], ['#EDEDE8', '无记录']]
      : [[doneColor, '已打卡'], ['repeating-linear-gradient(48deg,#8E8E86 0 3px,#C4C4BC 3px 6px)', '休息日'], ['repeating-linear-gradient(48deg,#C79A55 0 3px,#EBD9B8 3px 6px)', '请假'], ['#EDEDE8', '无记录']];
    h += '<div class="legend2">' + lg.map(function (x) {
      return '<span><i style="background:' + x[0] + '"></i>' + x[1] + '</span>';
    }).join('') + '</div>';
    h += '<div class="calhint">右上角小三角＝补打</div>';
  }
  /* 一键补齐：原来只在「全部」视图里出现，现在「全部」已移除，改放在每个习惯视图下 */
  {
    var pending = [];
    for (var pi = 7; pi >= 1; pi--) {
      var pd = addDays(t, -pi);
      if (parseISO(pd).getMonth() !== m || parseISO(pd).getFullYear() !== y) continue;
      if (hs.some(function (x) { return !recOf(x.id, pd); })) pending.push(pd);
    }
    if (parseISO(t).getMonth() !== m || parseISO(t).getFullYear() !== y) pending = [];
    if (pending.length) {
      h += '<div class="calmore"><button class="linkbtn" data-act="batchBack">最近 7 天有 ' +
        pending.length + ' 天没打满 · 一键补齐</button></div>';
    }
  }
  h += '</div>';

  if (sel) h += dayDetail(sel);

  /* 统计 */
  {
    var hb = habitById(recView.hid);
    var ms = monthStats(hb, y, m);
    h += '<div class="statcard"><div class="srow">' +
      '<div><b>' + streak(hb) + '<em> 天</em></b><span>当前连续</span></div>' +
      '<div><b>' + bestStreak(hb) + '<em> 天</em></b><span>最长连续</span></div>' +
      '<div><b>' + totalDays(hb) + '<em> 天</em></b><span>累计' + (hb.type === 'abstain' ? '坚持' : '打卡') + '</span></div>' +
      '</div><div class="srow2">' +
      (hb.type === 'abstain'
        ? '<span>累计破戒 <b>' + relapseCount(hb) + '</b> 次</span><span>本月坚持率 <b>' + ms.rate + '%</b></span>'
        : '<span>累计时长 <b>' + fmtMin(totalMinutes(hb)) + '</b></span>' +
          (ms.excused ? '<span>本月休息/请假 <b>' + ms.excused + '</b> 天</span>' : '') +
          '<span>本月完成率 <b>' + ms.rate + '%</b></span>') +
      '</div></div>';
  }

  {
    var hb2 = habitById(recView.hid);
    var ms2 = monthStats(hb2, y, m);
    h += '<div class="msum">' + (hb2.type === 'abstain'
      ? '本月坚持 <b>' + ms2.done + '</b> 天 · 坚持率 <b>' + ms2.rate + '%</b>'
      : '本月打卡 <b>' + ms2.done + '</b> 天 · 共 <b>' + fmtMin(ms2.mins) + '</b> · 完成率 <b>' + ms2.rate + '%</b>' +
        (ms2.excused ? ' · 休息/请假 <b>' + ms2.excused + '</b> 天' : '')) + '</div>';
  }
  return h;
}

function backupText() {
  var lb = S.settings.lastBackupAt;
  if (!lb) {
    var days = totalRecordDays();
    return days >= 7 ? '<span class="warn">从未备份，建议现在导出</span>' : '尚未备份';
  }
  var d = new Date(lb);
  var n = Math.floor((Date.now() - d.getTime()) / 86400000);
  var txt = (d.getMonth() + 1) + '月' + d.getDate() + '日';
  if (n > 0) txt += '（' + n + ' 天前）'; else txt += '（今天）';
  return n > 30 ? '<span class="warn">' + txt + ' ⚠️</span>' : txt;
}
function totalRecordDays() {
  var set = {};
  Object.keys(S.records).forEach(function (hid) {
    Object.keys(S.records[hid]).forEach(function (d) { set[d] = 1; });

}

/* ============================================================
   打卡弹层
   ============================================================ */
var sheet = { habit: null, date: null, mode: 'new', minutes: null, note: '', noteOpen: false };
function openCheckin(hid, date, mode) {
  var h = habitById(hid);
  var r = recOf(hid, date);
  sheet.habit = h; sheet.date = date; sheet.mode = mode || 'new';
  sheet.noteOpen = false;
  if (mode === 'edit' && r) {
    sheet.minutes = (typeof r.minutes === 'number') ? r.minutes : null;
    sheet.note = r.note || '';
    sheet.noteOpen = !!sheet.note;
  } else {
    sheet.note = '';
    var last = lastMinutes(hid);
    sheet.minutes = (last != null) ? last : (h.goalMinutes > 0 ? h.goalMinutes : null);
  }
  drawCheckin();
}
function drawCheckin() {
  var h = sheet.habit, goal = h.goalMinutes || 0;
  var last = lastMinutes(h.id);
  var vals = [15, 30, 45, 60];
  if (last != null && vals.indexOf(last) < 0) vals.push(last);
  var isEdit = sheet.mode === 'edit', isBack = sheet.mode === 'backfill';

  var title = isBack ? '补打 ' + fmtDateShort(sheet.date) : (isEdit ? '改时长 · ' + h.name : h.name + '打卡');
  var sub = isBack ? '这一天的记录会标记为「补打」' : (isEdit ? '修改后立即生效' : '选一个时长，或直接打卡');

  var html = '<div class="mask" data-close="1"></div><div class="sheet">' +
    '<div class="grip"></div>' +
    '<div class="shtitle">' + esc(title) + '</div><div class="shsub">' + sub + '</div>' +
    '<div class="bignum2" id="shNum">' + ((sheet.minutes == null) ? 0 : sheet.minutes) + '<span>分钟</span></div>' +
    '<div class="chips" id="shChips">' + vals.map(function (v) {
      return '<button data-min="' + v + '"' + (sheet.minutes === v ? ' class="on"' : '') + '>' +
        (v === last && [15,30,45,60].indexOf(v) < 0 ? '上次 ' + v : v) + '</button>';
    }).join('') + '</div>' +
    '<input class="numin" id="shInput" type="text" inputmode="numeric" placeholder="或手动输入分钟数" value="' +
      ((sheet.minutes == null) ? '' : sheet.minutes) + '">' +
    '<div class="shhint" id="shHint"></div>' +
    '<button class="ntoggle' + (sheet.noteOpen ? ' on' : '') + '" data-act="ntoggle">' +
      (sheet.noteOpen ? '收起备注' : '⌄ 加一句备注（可选）') + '</button>' +
    '<textarea class="note' + (sheet.noteOpen ? ' show' : '') + '" id="shNote" maxlength="50" rows="2" placeholder="今天的情况…">' +
      esc(sheet.note) + '</textarea>' +
    '<div class="shacts">' +
    '<button class="pbtn" id="shPrimary" data-act="save">' +
      (isEdit ? '保存' : (isBack ? '确认补打' : '完成打卡')) + '</button>' +
    (!isEdit ? '<button class="sbtn" data-act="nodur">不记时长，直接打卡</button>' : '') +
    '</div></div>';

  var root = $('#sheetRoot');
  root.innerHTML = html;
  bindCheckin();
  updateCheckin();
  playSheetMorph();
}
/* 播放形变进场：所有弹层渲染完后调用 */
function playSheetMorph() {
  var sheetEl = $('#sheetRoot .sheet');
  var maskEl = $('#sheetRoot .mask');
  if (!sheetEl || !maskEl) return;
  var inner = sheetEl.firstElementChild || sheetEl;
  var anims = morphIn(sheetEl, maskEl, inner, window.__lastTap);
  window.__sheetAnims = anims;
}
function updateCheckin() {
  var h = sheet.habit, goal = h.goalMinutes || 0, m = sheet.minutes;
  var hint = $('#shHint'), num = $('#shNum'), pri = $('#shPrimary');
  if (!hint) return;
  if (goal > 0) {
    if (m == null || m <= 0) hint.innerHTML = '目标 ' + goal + ' 分钟';
    else if (m >= goal) hint.innerHTML = '<b class="ok">✓ 已达标</b>';
    else hint.textContent = '还差 ' + (goal - m) + ' 分钟达标';
  } else hint.textContent = '';
  num.innerHTML = ((m == null) ? 0 : m) + '<span>分钟</span>';
  pri.disabled = !(m > 0);
  $$('#shChips button').forEach(function (b) { b.classList.toggle('on', +b.dataset.min === m); });
}
function bindCheckin() {
  var root = $('#sheetRoot');
  var input = $('#shInput');
  root.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    var chip = e.target.closest('[data-min]');
    if (chip) { sheet.minutes = +chip.dataset.min; input.value = sheet.minutes; updateCheckin(); return; }
    var tgl = e.target.closest('[data-act="ntoggle"]');
    if (tgl) {
      sheet.noteOpen = !sheet.noteOpen;
      tgl.classList.toggle('on', sheet.noteOpen);
      tgl.textContent = sheet.noteOpen ? '收起备注' : '⌄ 加一句备注（可选）';
      $('#shNote').classList.toggle('show', sheet.noteOpen);
      if (sheet.noteOpen) $('#shNote').focus();
      return;
    }
    if (e.target.closest('[data-act="save"]')) { commitCheckin(sheet.minutes); return; }
    if (e.target.closest('[data-act="nodur"]')) { commitCheckin(null); return; }
  });
  if (input) input.addEventListener('input', function () {
    var v = input.value.replace(/[^0-9]/g, '');
    input.value = v;
    var n = v === '' ? null : Math.min(1440, parseInt(v, 10));
    sheet.minutes = n;
    updateCheckin();
  });
  var note = $('#shNote');
  if (note) note.addEventListener('input', function () { sheet.note = note.value; });
}
function closeSheet() {
  var mask = $('#sheetRoot .mask'), sh = $('#sheetRoot .sheet');
  if (!sh) { $('#sheetRoot').innerHTML = ''; return; }
  /* 若有进行中的进场动画，先取消再反向收回 */
  if (window.__sheetAnims) {
    window.__sheetAnims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
    window.__sheetAnims = null;
  }
  var inner = sh.firstElementChild || sh;
  morphOut(sh, mask, inner, window.__lastTap, function () {
    $('#sheetRoot').innerHTML = '';
  });
}
function commitCheckin(minutes) {
  var h = sheet.habit, d = sheet.date;
  var prev = recOf(h.id, d) || {};
  var rec = {
    status: 'done',
    minutes: (typeof minutes === 'number' && minutes > 0) ? minutes : null,
    note: sheet.note || '',

function batchBackfill() {
  var t = todayISO(), hs = activeHabits();
  var plan = [];
  for (var i = 7; i >= 1; i--) {
    var d = addDays(t, -i);
    var need = hs.filter(function (h) { return !recOf(h.id, d); });
    if (need.length) plan.push({ date: d, need: need });
  }
  if (!plan.length) { toast('最近 7 天都已经有记录了'); return; }
  var lines = plan.map(function (p) {
    return fmtDateShort(p.date) + '：' + p.need.map(function (h) { return esc(h.name); }).join('、');
  }).join('<br>');
  confirmDlg('一键补齐最近 7 天？',
    '下面这些会按各自的默认时长记为「补打」，已有记录不动（休息日和请假不会被动到）：<br><br>' + lines,
    '全部补齐', function () {
      var n = 0;
      plan.forEach(function (p) {
        p.need.forEach(function (h) {
          if (h.type === 'abstain') {
            setRec(h.id, p.date, { status: 'kept', note: '', backfilled: true, at: new Date().toISOString() });
          } else {
            var last = lastMinutes(h.id);
            var goal = h.goalMinutes > 0 ? h.goalMinutes : null;
            var m = (last != null) ? last : goal;
            setRec(h.id, p.date, { status: 'done', minutes: m, note: '', backfilled: true, at: new Date().toISOString() });
          }
          n++;
        });
      });
      save(); render();
      toast('已补齐 ' + n + ' 条记录');
    });
}

/* 全屏页从按钮形变展开：clip-path 从按钮矩形扩到整屏（round 圆角同步收放） */
function morphPageIn(srcEl) {
  var page = $('#pageRoot');
  var sr = sourceRect(srcEl);
  if (!page || !page.animate || !sr) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  var from = 'inset(' + Math.round(sr.top) + 'px ' + Math.round(vw - sr.right) + 'px ' +
             Math.round(vh - sr.bottom) + 'px ' + Math.round(sr.left) + 'px round 999px)';
  var to = 'inset(0px 0px 0px 0px round 0px)';
  page.style.visibility = 'visible';
  page.animate([
    { clipPath: from, opacity: .55 },
    { clipPath: to, opacity: 1 }
  ], { duration: 520, easing: MORPH_EASE, fill: 'both' });
  var inner = page.querySelector('.page-in');
  if (inner) inner.animate([
    { opacity: 0, transform: 'translateY(16px)' },
    { opacity: 0, transform: 'translateY(16px)', offset: .55 },
    { opacity: 1, transform: 'translateY(0)' }
  ], { duration: 520, easing: 'ease-out', fill: 'both' });
}
function morphPageOut(srcEl, done) {
  var page = $('#pageRoot');
  var sr = sourceRect(srcEl);
  if (!page || !page.animate || !sr) { if (done) done(); return; }
  var vw = window.innerWidth, vh = window.innerHeight;
  var to = 'inset(' + Math.round(sr.top) + 'px ' + Math.round(vw - sr.right) + 'px ' +
           Math.round(vh - sr.bottom) + 'px ' + Math.round(sr.left) + 'px round 999px)';
  var main = page.animate([
    { clipPath: 'inset(0px 0px 0px 0px round 0px)', opacity: 1 },
    { clipPath: to, opacity: .5 }
  ], { duration: 380, easing: 'cubic-bezier(.4,0,.7,.3)', fill: 'both' });
  var inner = page.querySelector('.page-in');
  if (inner) inner.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'ease-in', fill: 'both' });
  var finish = function () { if (done) done(); };
  if (main.finished && main.finished.then) main.finished.then(finish).catch(finish);
  else main.onfinish = finish;
}

/* ============================================================
   标签让位（FLIP）：选中项用真实布局放大（padding/字号），邻项被平滑挤开。
   render() 会重建 DOM，所以用标准 FLIP：
     ① 切换前记录每个标签的位置 ② 重渲染（选中态已变，布局真的变了）
     ③ 给新标签设反向位移 ④ 强制回流后过渡回 0 —— 视觉上就是"平滑让位"
   用 data-hid 对应标签身份，不用下标。
   ============================================================ */
function switchPill(hid) {
  var oldRow = $('.fpills');
  var before = {};
  var oldScroll = oldRow ? oldRow.scrollLeft : 0;
  if (oldRow) {
    Array.prototype.slice.call(oldRow.querySelectorAll('.fpill')).forEach(function (p) {
      var r = p.getBoundingClientRect();
      before[p.dataset.hid] = { left: r.left, top: r.top };
    });
  }
  recView.hid = hid;
  var keepY = window.scrollY;
  render();
  var newRow = $('.fpills');
  if (newRow) {
    newRow.scrollLeft = oldScroll;
    Array.prototype.slice.call(newRow.querySelectorAll('.fpill')).forEach(function (p) {
      var b = before[p.dataset.hid];
      if (!b) return;
      var r = p.getBoundingClientRect();
      var dx = b.left - r.left, dy = b.top - r.top;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
      /* 用 WAAPI 而不是 CSS 过渡：刚插入的元素上 CSS 过渡不一定触发 */
      p.style.transform = '';
      p.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px)' },
        { transform: 'translate(0,0)' }
      ], { duration: 320, easing: 'cubic-bezier(.22,1,.36,1)' });
    });
  }
  window.scrollTo(0, keepY);
}

/* ============================================================
   长按排序（今日页卡片）
   长按拿起 → 卡片跟手 → 越过邻卡中线即时换位 → 松手保存顺序
   这里刻意不做位移动画：换位就是真实列表重排，即时生效，没有虚线空槽、
   没有其余卡片弹簧让位、松手后落位也没有过渡。
   ============================================================ */
var drag = {
  el: null, hid: null, active: false, holdTimer: null,
  startY: 0, startX: 0, grabOffset: 0, insertIndex: -1, tilt: '-.5deg', reordered: false
};
var LONGPRESS_MS = 300;
var LONGPRESS_MOVE = 8;      /* 长按判定前允许的抖动，超过即视为滚动并取消 */

function cardsInView() {
  return Array.prototype.slice.call(document.querySelectorAll('#view .card[data-hid]'));
}
function clearHold() {
  if (drag.holdTimer) { clearTimeout(drag.holdTimer); drag.holdTimer = null; }
}
/* 让拖动中的卡片跟着指针：锚点是指针本身，所以与页面滚动无关 */
function placeDragCard(ptrY) {
  var el = drag.el;
  if (!el) return;
  el.style.transform = '';
  var naturalTop = el.getBoundingClientRect().top;      /* 读换位后的自然位置 */
  var ty = ptrY - drag.grabOffset - naturalTop;
  el.style.transform = 'translate3d(0,' + ty + 'px,0) rotate(' + drag.tilt + ')';
}
/* 落点是第几号槽（在"其余卡片"里数，拖动项自己不参与几何） */
function slotAt(ptrY) {
  var others = cardsInView().filter(function (c) { return c !== drag.el; });
  for (var i = 0; i < others.length; i++) {
    var r = others[i].getBoundingClientRect();
    if (ptrY < r.top + r.height / 2) return i;
  }
  return others.length;
}
function cancelDrag() {
  clearHold();
