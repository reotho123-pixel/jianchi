<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>坚持</title>
<meta name="theme-color" content="#F6F6F4">
<meta name="description" content="健身 · 戒撸，只记录今天。一个屏幕，一个问题，一个按钮。">
<meta name="app-version" content="v2.0">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="坚持">
<link rel="stylesheet" href="./fonts/lxgwwenkai-light.css">
<style>
@property --p{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F6F6F4;--ink:#1A1A1A;--muted:#9A9A94;--line:#E9E9E4;
  --soft:#2E2E2E;--white:#fff;
  --green:#DDEBCB;--purple:#DED8EF;--blue:#CFE0EF;
  --empty:#EDEDE8;
}
html{-webkit-text-size-adjust:100%}
/* 禁止双指捏合缩放。viewport 的 user-scalable=no 在 iOS 上会被忽略，
   touch-action 才是真正生效的那层；双击放大交给 touch-action:manipulation。 */
html,body{touch-action:pan-x pan-y;overscroll-behavior:none}
/* 禁掉长按选中文字 / 长按弹出「拷贝·查询」气泡 / 长按元素被拎起来放大。
   输入框必须单独开回来。 */
html,body{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:default;
}
body{
  margin:0;background:radial-gradient(125% 58% at 50% 0%,#FCFCFA 0%,#F6F6F4 64%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"LXGW WenKai","Kaiti SC","STKaiti",KaiTi,"PingFang SC","Microsoft YaHei",serif;
  font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,h5,h6,b,strong{font-weight:300}
button,input,textarea{font-family:inherit;font-weight:300;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:0;height:0}

#app{
  max-width:480px;margin:0 auto;
  padding:22px 18px 30px;
  min-height:100vh;
}

/* ---------- 顶部 ---------- */
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;margin-bottom:6px}
.top .tmain{grid-column:2;text-align:center;min-width:0}
.h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.4px}
.date{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.gear{
  grid-column:3;justify-self:end;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.86);box-shadow:0 2px 8px rgba(26,26,26,.06);
  display:grid;place-items:center;font-size:17px;color:var(--muted);letter-spacing:0;
}

/* ---------- 今日的树 ---------- */
.hero{text-align:center;margin:2px 0 20px}
.ring{position:relative;width:216px;height:216px;margin:0 auto}
.ring > svg.ring2{position:absolute;left:0;top:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:var(--line);stroke-width:7}
.ring .rfg{fill:none;stroke:#8FB55C;stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .55s cubic-bezier(.22,1,.36,1)}
/* 树根处一层柔光；用 alpha 渐变收边，免得跟页面背景的渐变接出一条缝 */
.ring .halo{position:absolute;inset:26px;border-radius:50%;
  background:radial-gradient(circle at 50% 78%,rgba(237,245,225,.95) 0%,rgba(237,245,225,0) 72%)}
.ring .tree{position:absolute;left:26px;right:26px;top:21px;bottom:16px}
.ring .tree svg{width:100%;height:100%;display:block;overflow:visible}
.ring .sprout{position:absolute;inset:0;display:grid;place-items:center}
.ring .sprout svg{width:90px;height:108px;opacity:.92}
.hmain{font-size:15px;line-height:1.5;margin-top:7px;font-variant-numeric:tabular-nums}
.hsub{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.hsub.done{color:#5F8A2A}
.hsub.paused{color:#9A7A4A}
.hcount{font-size:11.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.hcount b{color:var(--ink);font-size:13px}

/* ---------- 习惯卡 ---------- */
.cards{display:flex;flex-direction:column;gap:16px}
.card{
  position:relative;border-radius:26px;
  padding:16px 18px 14px;
  background:linear-gradient(142deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:0 6px 18px rgba(26,26,26,.075);
  border:1.5px dashed rgba(255,255,255,.88);
  transform:rotate(-.45deg);
}
.card.rr{transform:rotate(.45deg)}
.ctop{display:flex;align-items:center;gap:12px}
.ic{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.88);font-size:20px;display:grid;place-items:center;box-shadow:0 3px 9px rgba(26,26,26,.07);transform:rotate(-3deg);flex:0 0 auto}
.cname{flex:1;min-width:0;font-size:18.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{font-size:22px;line-height:1;letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.total em{font-style:normal;font-size:12px;color:rgba(26,26,26,.5);margin-left:2px}
.q{font-size:18.5px;line-height:1.4;margin:13px 2px 12px;letter-spacing:-.2px}
.do{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:14px 0;border-radius:999px;
  background:#fff;font-size:15px;
  box-shadow:0 3px 10px rgba(26,26,26,.08);
  transition:transform .18s ease,background .22s ease,color .22s ease,box-shadow .22s ease;
}
.do:active{transform:scale(.985)}
.do.done{background:var(--deep);color:#fff;box-shadow:none}
.do .mark{font-size:13px;opacity:.55}
.do.done .mark{opacity:1}
.hint{font-size:11.5px;color:rgba(26,26,26,.5);text-align:center;margin-top:8px;line-height:1.5}
.hint.done{color:rgba(26,26,26,.58)}

/* ---------- 空状态 ---------- */
.empty{background:rgba(255,255,255,.95);border-radius:24px;padding:30px 20px;text-align:center;font-size:14px;color:var(--muted);border:1.4px dashed rgba(26,26,26,.1);line-height:1.8}
.empty .pbtn{margin-top:14px}

/* ---------- 设置 ---------- */
.sect2{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:20px 2px 10px}
.sect2::before{content:"";width:6px;height:6px;border-radius:50%;background:#C6DFA4}
.list{background:rgba(255,255,255,.95);border-radius:24px;overflow:hidden;border:1.4px dashed rgba(26,26,26,.09);box-shadow:0 5px 16px rgba(26,26,26,.06)}
.lrow{display:flex;align-items:center;gap:13px;padding:15px 17px;width:100%;text-align:left}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .lico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:var(--cardbg)}
.lrow .lmain{flex:1;min-width:0}
.lrow .lname{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lsub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.lrow .larr{font-size:13px;color:var(--muted);flex:0 0 auto}
.addbtn{display:block;width:100%;margin-top:11px;padding:15px 0;border-radius:999px;background:rgba(255,255,255,.95);font-size:14.5px;border:1.4px dashed rgba(26,26,26,.1);box-shadow:0 4px 14px rgba(26,26,26,.06)}
.danger{display:block;width:100%;margin-top:4px;padding:15px 0;border-radius:999px;background:rgba(255,255,255,.95);font-size:14.5px;color:#B4733F;border:1.4px dashed rgba(180,115,63,.25)}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.8}

/* ---------- 长成的树 ---------- */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.gcard{
  background:rgba(255,255,255,.95);border-radius:20px;padding:8px 6px 10px;text-align:center;
  box-shadow:0 4px 14px rgba(26,26,26,.06);
}
.gcard svg{width:100%;height:78px;display:block}
.gcard .gname{font-size:11.5px;font-weight:700;color:#4A5A48;margin-top:2px}
.gcard .gdate{font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.gempty{
  background:rgba(255,255,255,.95);border-radius:24px;padding:34px 20px;text-align:center;
  font-size:13.5px;color:var(--muted);border:1.4px dashed rgba(26,26,26,.1);line-height:1.9;
}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(26,26,26,.34);z-index:50;opacity:0;pointer-events:none;transition:opacity .28s ease}
.mask.in{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;
  background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px 30px;
  max-height:90vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -10px 40px rgba(26,26,26,.12);
}
.sheet.in{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:99px;background:#D8D8D2;margin:4px auto 16px}
.shtitle{font-size:20px}
.shsub{font-size:13px;color:var(--muted);margin-top:5px;margin-bottom:16px;line-height:1.6}
.pbtn{display:block;width:100%;padding:16px 0;border-radius:999px;background:var(--soft);color:#fff;font-size:15px}
.sbtn{display:block;width:100%;padding:14px 0;border-radius:999px;background:transparent;font-size:13.5px;color:var(--muted);margin-top:4px}
.pfoot{margin-top:26px}

/* ---------- 习惯编辑 ---------- */
.field{margin-top:18px}
.field>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.field input[type=text]{
  width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid transparent;background:#fff;
  font-size:16px;outline:none;
}
.field input:focus{border-color:#CFCFC8}
.typecards{display:flex;gap:9px}
.typecard{flex:1;padding:14px 13px;border-radius:16px;background:#fff;text-align:left;font-size:13px;line-height:1.45;color:var(--ink)}
.typecard b{display:block;font-size:14px;margin-bottom:3px}
.typecard.on{background:var(--soft);color:#fff}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker button{width:44px;height:44px;border-radius:14px;background:#fff;font-size:20px;display:grid;place-items:center}
.picker button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.picker.col button{width:38px;height:38px;border-radius:50%;background:var(--pc)}
.picker.col button.on{box-shadow:inset 0 0 0 2px var(--ink)}

/* ---------- 对话框 ---------- */
.dlgwrap{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;
  background:rgba(26,26,26,.32);opacity:0;transition:opacity .2s ease;
}
.dlgwrap.show{opacity:1}
.dlg{
  width:min(340px,100%);background:var(--bg);border-radius:26px;padding:24px 22px;
  box-shadow:0 20px 50px rgba(26,26,26,.2);
  transform:translateY(8px) scale(.98);transition:transform .22s ease;
}
.dlgwrap.show .dlg{transform:translateY(0) scale(1)}
.dlg h3{margin:0 0 10px;font-size:17px}
.dlg p{margin:0 0 20px;font-size:13.5px;color:var(--muted);line-height:1.65}
.dlg .dacts{display:flex;gap:9px}
.dlg .dacts button{flex:1;padding:13px 0;border-radius:999px;font-size:14px;background:#fff}
.dlg .dacts .danger{background:#E8B4B4;color:#7A2B2B;margin-top:0}
.dlg .dacts .pbtn{padding:13px 0;font-size:14px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);
  background:var(--soft);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .24s ease;z-index:80;white-space:nowrap;max-width:88vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
.pop{animation:pop .5s ease}
</style>
</head>
<body>

<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toast"></div>

<script>
/* 禁掉双指捏合缩放。加进主屏后还能捏小的话，露出的白边会让人一眼看出是网页。 */
(function lockZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });
})();

var TREEW = (function(){
/* ===================== 工具 ===================== */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const DEG   = d => d * Math.PI / 180;
const wait  = ms => new Promise(r => setTimeout(r, ms));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function rnd(i){ const x = Math.sin(i*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
/* 生长曲线：前期涨得快，保证每天都能看见变化 */
function sizeOf(w){ return .28 + .72 * Math.pow(clamp(w, 0, 1), .42); }
function hex2rgb(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function mixc(a,b,t){
  const A = Array.isArray(a) ? a : hex2rgb(a), B = Array.isArray(b) ? b : hex2rgb(b);
  return A.map((v,i) => Math.round(lerp(v, B[i], t)));
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function todayStr(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function dayDiff(a,b){
  const A = a.split('-').map(Number), B = b.split('-').map(Number);
  return Math.round((new Date(B[0],B[1]-1,B[2]) - new Date(A[0],A[1]-1,A[2])) / 86400000);
}
function prettyDate(s){
  const p = s.split('-').map(Number);
  return `${p[1]}月${p[2]}日`;
}

/* ===================== 品种（50 种，按原型 archetype 驱动） =====================
   a 原型：
     spread   开展伞形（樱/桃/杏/梨/苹果/海棠/合欢…）
     round    团冠（香樟/悬铃木/国槐/椴…）
     vase     杯形（榆/榉/梧桐/玉兰…）
     umbrella 裸干平顶（松/木棉/凤凰木/栾…）
     weep     垂枝（垂柳）
     gnarl    虬曲老树（梅/蜡梅）
     fan      扇形叶（银杏）
     conifer  层叠针叶塔形（雪松/云杉/冷杉/水杉/圆柏）
     column   细高柱形/火焰形（侧柏/龙柏/意大利柏）
     shrub    灌木丛（山茶/紫薇/丁香/紫荆/石榴）
     palm     棕榈
     bamboo   竹丛
   P 参数（省略就用 DEF 默认值，见下文）
   f 花：{ c 颜色, k 花型, s 大小, bare 先花后叶 }
*/
const SPECIES = [
  /* ---- 0-9 起步 ---- */
  { n:'马尾松', p:0,    a:'umbrella', b:'#7a5636', l:['#2f6b3f','#4e9152','#7ab86a'],
    P:{ th:82, tw:11, limbs:5, angBase:34, angStep:14, len:42, spread:26, up:1.02, maxAng:84, dec:[.64,.88], depth:3, massS:.72, leafKind:'needle', leafS:1.0, leafN:8 } },
  { n:'白桦',   p:60,   a:'round',    b:'#e6e3da', l:['#5a8f4a','#8dc06a','#c2dc8e'],
    P:{ th:56, tw:7.5, limbs:4, angBase:18, angStep:12, len:40, spread:34, up:.80, dec:[.62,.88], depth:3, massS:.72, tw2:'#b9b4a6' } },
  { n:'垂柳',   p:120,  a:'weep',     b:'#6b5540', l:['#5a8f4a','#83b55e','#b2d47c'],
    P:{ th:56, tw:12, limbs:5, angBase:14, angStep:7, len:31, spread:16, up:1.18, maxAng:88, grav:.90, dec:[.74,.94], depth:4, massS:.48, leafS:.72, leafN:4, hangLeaf:true, leafKind:'narrow', ordHi:.90 } },
  { n:'香樟',   p:180,  a:'round',    b:'#6a5340', l:['#2b5f3c','#3f854d','#63a660'],
    P:{ th:40, tw:12, limbs:5, angBase:20, angStep:12, len:42, spread:36, up:.74, dec:[.64,.88], depth:3, massS:1.06 } },
  { n:'榆树',   p:240,  a:'vase',     b:'#5f4a34', l:['#3f7a44','#5da05a','#8fc478'],
    P:{ th:36, tw:11, limbs:4, angBase:15, angStep:14, len:56, spread:22, up:.94, dec:[.66,.92], depth:3, massS:.9 } },
  { n:'银杏',   p:300,  a:'fan',      b:'#6a5334', l:['#8a9a2e','#c4b83c','#e8d45a'],
    P:{ th:44, tw:9, limbs:4, angBase:20, angStep:13, len:46, spread:30, up:.74, dec:[.60,.84], depth:3, massS:.84, leafS:1.5, leafKind:'fan' } },
  { n:'梧桐',   p:360,  a:'vase',     b:'#8a9a86', l:['#3a7a45','#59a05c','#8cc47c'],
    P:{ th:46, tw:13, limbs:5, angBase:16, angStep:12, len:52, spread:24, up:.92, dec:[.66,.92], depth:3, massS:1.0, leafS:2.3, leafN:3 } },
  { n:'悬铃木', p:420,  a:'round',    b:'#8f8a72', l:['#3f7a42','#5da054','#93c474'],
    P:{ th:48, tw:14, limbs:5, angBase:22, angStep:11, len:44, spread:38, up:.76, dec:[.66,.90], depth:3, massS:1.12 } },
  { n:'枫香',   p:480,  a:'spread',   b:'#5f4630', l:['#8c3a26','#c2542f','#e08a45'],
    P:{ th:46, tw:11, limbs:4, angBase:22, angStep:13, len:50, spread:32, up:.84, depth:3 } },
  { n:'鸡爪槭', p:540,  a:'spread',   b:'#5a4530', l:['#6e1f22','#a52a2a','#d4453a'],
    P:{ th:34, tw:7, limbs:5, angBase:26, angStep:12, len:40, spread:36, up:.86, dec:[.56,.80], depth:3, massS:.66, leafS:.7, leafN:6 } },

  /* ---- 10-19 观叶 / 常绿 ---- */
  { n:'元宝枫', p:600,  a:'spread',   b:'#5f4630', l:['#a04a1e','#cc6a28','#e8a04a'],
    P:{ th:40, tw:9, limbs:4, angBase:24, angStep:13, len:46, spread:34, up:.82, depth:3 } },
  { n:'五角枫', p:660,  a:'spread',   b:'#6a5138', l:['#7c8f2c','#b5ab38','#e0c24a'],
    P:{ th:42, tw:9, limbs:4, angBase:22, angStep:13, len:48, spread:32, up:.84, depth:3 } },
  { n:'桂花',   p:720,  a:'round',    b:'#5e4a36', l:['#2e6b3c','#458a4a','#6ba85e'],
    P:{ th:36, tw:11, limbs:5, angBase:20, angStep:12, len:38, spread:36, up:.72, dec:[.62,.86], depth:3, massS:1.0 },
    f:{ c:'#e8c85a', k:'dot', s:.9 } },
  { n:'玉兰',   p:780,  a:'vase',     b:'#8a8578', l:['#3f7a44','#5da05a','#8fc478'],
    P:{ th:42, tw:11, limbs:4, angBase:18, angStep:13, len:50, spread:26, up:.88, dec:[.62,.86], depth:3, massS:.86, leafS:1.7, leafN:3 },
    f:{ c:'#fbfaf6', k:'cup', s:1.5, bare:true } },
  { n:'紫玉兰', p:840,  a:'vase',     b:'#7a7566', l:['#3f7a44','#5da05a','#8fc478'],

/* 每个品种的取景缩放：把树统一收进 190×190 的框里（只缩不放）
   由实测 w=1 时的包围盒算出：k = min(1, 160/高, 90/半宽) */
const FIT = [
  .726,.838,.811,.692,.600,.796,.596,.789,.677,.776,
  .894,.812,1,   .800,.667,1,   1,   1,   .957,1,
  .857,.796,.928,.776,.938,1,   .918,.891,.726,.703,
  .662,.776,.769,.874,.904,.769,.763,.957,.634,.776,
  .882,1,   1,   1,   1,   1,   1,   1,   1,   .952
];
const fitOf = i => FIT[((i % FIT.length) + FIT.length) % FIT.length] || 1;

/* ===================== 画树 ===================== */
/* 统一坐标系：树根在 (0,0)，向上为负 y。整棵最大约 150 高、190 宽。
   四种造型器产出同一种中间结构，画法只有一份：
   {
     S,                                     缩放
     segs:   [{x0,y0,x1,y1,cx,cy,a1,w0,d,trunk,ord}],
     masses: [{x,y,r,ord,sd,tone,grow}],
     leaves: [{x,y,ang,s,tone,ord,k,kind,stem,fade}],
     blooms: [{x,y,ord,bo,r,k}]
   }
   a 原型 → 造型器：
     spread/round/vase/umbrella/weep/gnarl/fan  → shapeSpread
     conifer/column                             → shapeConifer
     shrub                                      → shapeShrub
     bamboo                                     → renderBamboo
*/

const DEF = {
  th:46, tw:10, lean:1, limbs:4,
  angBase:22, angStep:13, len:50,
  spread:32, up:.84, dec:[.54,.84], depth:3,
  wob:20, sag:0, massS:1, leafS:1, leafN:5,
  ordHi:.86, leafKind:'oval', maxAng:84, grav:0, hangLeaf:false
};
const PP = P => Object.assign({}, DEF, P || {});

function mkShape(){ return { S:1, segs:[], masses:[], leaves:[], blooms:[] }; }

/* 按高度分配明暗：所有原型共用，保证配色统一 */
function toneUp(list, lo, hi){
  let yMin = Infinity, yMax = -Infinity;
  for(const m of list){ if(m.y < yMin) yMin = m.y; if(m.y > yMax) yMax = m.y; }
  const span = Math.max(1, yMax - yMin);
  for(const m of list){
    m.tone = clamp(lo + ((yMax - m.y) / span) * (hi - lo) + (rnd(m.sd) - .5) * .20, 0, 1);
  }
}

/* ---------- 1. 通用分叉树：开展 / 团冠 / 杯形 / 伞形 / 垂枝 / 虬曲 ---------- */
function shapeSpread(w, seed, sp){
  const P = PP(sp.P);
  const sh = mkShape();
  const S = sizeOf(w); sh.S = S;
  const TH = P.th * S;
  const lvl = P.depth + 1;
  const step = (P.ordHi - .02) / lvl;
  const wob = P.wob;
  let k = seed;

  sh.segs.push({ x0:0, y0:0, x1:P.lean * S, y1:-TH, w0:P.tw * S, w1:P.tw * .46 * S,
                 d:lvl, trunk:true, ord:0, a1:0 });

  const MAXA = P.maxAng || 84;
  const DEP = Math.max(1, P.depth);
  function limb(x0, y0, ang, len, wid, d, ord){
    k++;
    const a1 = ang + (rnd(k * 7 + 3) - .5) * wob;
    const gt = P.grav ? P.grav * clamp(1 - d / DEP, 0, 1) : 0;   // 末梢受重力下垂
    const x1 = x0 + Math.sin(DEG(a1)) * len;
    const y1 = y0 - Math.cos(DEG(a1)) * len + gt * len;
    const ca = ang + (a1 - ang) * .5;
    const cx = x0 + Math.sin(DEG(ca)) * len * .54;
    const cy = y0 - Math.cos(DEG(ca)) * len * .54 + gt * len * .55 + P.sag * len * .40;
    sh.segs.push({ x0, y0, x1, y1, cx, cy, a1, w0:wid, d, ord });

    if(d <= 0) return;
    for(let i=0;i<2;i++){
      const t = i - .5;
      const na = clamp(a1 * P.up + t * P.spread * (1 + d * .10) + (rnd(k*3 + i*17) - .5) * wob * .8, -MAXA, MAXA);
      limb(x1, y1, na, len * lerp(P.dec[0], P.dec[1], rnd(k*5 + i*11)), wid * .60, d - 1,
           clamp(ord + step * (.75 + rnd(k*9 + i*3) * .55), 0, 1));
    }
  }

  const n = P.limbs;
  for(let i=0;i<n;i++){
    let a;
    if(n % 2 === 1 && i === n - 1) a = (rnd(seed + i*31) - .5) * 9;          // 正中主枝
    else {
      const side = (i % 2) ? 1 : -1;
      const rank = Math.floor(i / 2);
      a = side * (P.angBase + rank * P.angStep) + (rnd(seed + i*31) - .5) * 10;
    }
    const h = 1 - Math.floor(i / 2) * .17;                                   // 越外侧的枝着生点越低
    limb(P.lean * S * h, -TH * h, a, P.len * S * (.92 + rnd(seed + i*7) * .20),
         P.tw * .54 * S * (1 - i * .05), P.depth, .02 + i * .030);
  }

  /* ---- 树冠体块 ---- */
  const sc = P.massS * S;
  for(const sg of sh.segs){
    if(sg.trunk) continue;
    const dt = 1 - sg.d / lvl;
    const R = sc * (10 + dt * 7);
    const sd = Math.round(Math.abs(sg.x1) * 7 + Math.abs(sg.y1) * 3 + sg.d * 13) + seed * 3;
    if(sg.d >= 1) sh.masses.push({ x:(sg.x0+sg.x1)/2, y:(sg.y0+sg.y1)/2, r:R*1.05, ord:sg.ord, sd });
    if(sg.d <= 1) sh.masses.push({ x:sg.x1, y:sg.y1, r:R*.92, ord:clamp(sg.ord + step*.5, 0, 1), sd:sd+3 });
  }
  toneUp(sh.masses, .06, .90);
  for(const m of sh.masses){ m.grow = .07 + rnd(m.sd + 9) * .16; m.r *= .84 + rnd(m.sd + 21) * .34; }

  /* ---- 叶片 ---- */
  const tips = sh.segs.filter(sg => sg.d === 0);
  const HANG = !!P.hangLeaf;
  tips.forEach((sg, i) => {
    const gap = P.leafN > 4 ? 26 : 38;
    for(let j=0;j<P.leafN;j++){
      const off = (j - (P.leafN-1)/2) * (HANG ? 46 : gap) + (rnd(i*13 + j*7) - .5) * (HANG ? 20 : 26);
      const a = HANG ? 180 + off : clamp(sg.a1 + off, -114, 114);
      const dy = 1.6 + rnd(i*11 + j*5) * 4.2;
      sh.leaves.push({
        x: sg.x1 + Math.sin(DEG(a)) * dy,
        y: sg.y1 - Math.cos(DEG(a)) * dy + 1.6,
        ang: a, kind: HANG ? 'narrow' : P.leafKind, tip: true,
        s: (3.4 + rnd(i*3 + j*17) * 1.9) * P.leafS,
        tone: .60 + rnd(i*5 + j*3) * .38,
        ord: clamp(sg.ord + j*.006, 0, 1),
        k: i*17 + j*5 + 3
      });
    }
  });
  /* 枝条中段的叶子 */
  for(const sg of sh.segs){
    if(sg.trunk || sg.d > 1) continue;
    const hang = HANG;
    for(let m=0;m<3;m++){
      const t = .30 + m * .26;
      const a = hang ? 180 + (rnd(sg.d*31 + m*11) - .5) * 44 : sg.a1 + (m - 1) * 62;
      sh.leaves.push({
        x: sg.x0 + (sg.x1 - sg.x0) * t + (sg.cx - (sg.x0+sg.x1)/2) * .55 + (hang ? (m-1)*4 : 0),
        y: sg.y0 + (sg.y1 - sg.y0) * t + (sg.cy - (sg.y0+sg.y1)/2) * .55 + (hang ? 2 : 0),
        ang: hang ? a : clamp(a, -160, 160), kind: hang ? 'narrow' : P.leafKind,
        s: (3.0 + rnd(sg.d*7 + m*11) * 1.5) * P.leafS,
        tone: .52 + rnd(sg.d + m*7) * .40,
        ord: clamp(sg.ord + .022, 0, 1),
        k: Math.round(Math.abs(sg.x1) * 5 + m * 7)
      });
    }
  }
  /* 幼苗期主干上的叶子，免得小苗是一根光杆 */
  for(let i=0;i<6;i++){
    const h = .38 + i * .115;
    sh.leaves.push({
      x: (i%2 ? 1 : -1) * (4 + 8*h) * S,
      y: -TH * h,
      ang: (i%2 ? 1 : -1) * (68 + rnd(i+61) * 22),
      s: (5.4 + rnd(i+71) * 2.4) * (.80 + .30 * S) * P.leafS,
      tone: .34 + h * .48, ord: .012 + i * .022,
      stem: true, fade: .22 + i * .072, kind: P.leafKind, k: i + 200
    });
  }

  /* ---- 开花点：枝梢 + 一部分叶片位置 ---- */
  const bl = sh.segs.filter(sg => sg.d <= 1).map(sg => ({ x:sg.x1, y:sg.y1, ord:sg.ord, k:sg.d*13 + 5 }));
  const lf = sh.leaves.filter(l => l.tip);
  for(let i=1;i<lf.length;i+=3) bl.push({ x:lf[i].x, y:lf[i].y, ord:lf[i].ord, k:lf[i].k });
  bl.sort((a,b) => b.y - a.y);
  bl.forEach((t,i) => { t.bo = bl.length < 2 ? 0 : i / (bl.length - 1); t.r = 3.7 + rnd(t.k) * 1.7; });
  sh.blooms = bl;

  /* ---- 先花后叶：叶片整体推迟到开花之后 ---- */
  if(sp.f && sp.f.bare){
    for(const m of sh.masses) m.ord = .88 + clamp(m.ord, 0, 1) * .12;
    for(const l of sh.leaves) l.ord = .88 + clamp(l.ord, 0, 1) * .12;
  }
  return sh;
}

/* ---------- 2. 针叶塔形 / 柱形 ---------- */
function shapeConifer(w, seed, sp){
  const P = PP(sp.P);
  const sh = mkShape();
  const S = sizeOf(w); sh.S = S;
  const H = (P.h || 130) * S;
  const L = P.layers || 6;
  const shown = w * (L + .6);
  let topY = 0;

  for(let i=0;i<L;i++){
    const t = L < 2 ? 0 : i / (L - 1);
    const grow = clamp(shown - i, 0, 1);
    if(grow <= .02) continue;
    const y = -H * (P.base + (1 - P.base) * t);
    if(y < topY) topY = y;
    const off = P.snake ? Math.sin(i * 1.15) * lerp(P.w0, P.w1, t) * S * .45 : 0;
    const halfW = lerp(P.w0, P.w1, t) * S * grow * (1 + (rnd(seed + i*13) - .5) * .16);
    const droop = (P.droop || 0) * halfW;
    const bw = (P.bw || 2.2) * S * (1 - t * .62);
    const ord = clamp(.02 + t * P.ordHi * .95, 0, .96);

    sh.segs.push({ x0:off, y0:y, x1:off - halfW, y1:y + droop, a1:-42,
                   cx:off - halfW*.34, cy:y - 1.5*S, w0:bw, d:0, ord });
    sh.segs.push({ x0:off, y0:y, x1:off + halfW, y1:y + droop, a1:42,
                   cx:off + halfW*.34, cy:y - 1.5*S, w0:bw, d:0, ord });

    const n = 3;
    for(let j=0;j<n;j++){
      const u = (j + 1) / (n + 1);
      const rr = P.massS * S * (11.5 - t * 3.6) * (P.feather ? .84 : 1);
      for(const s of [-1, 1]){
        sh.masses.push({
          x: off + s * halfW * u, y: y + droop * u * u,
          r: rr * (1 - u * .16), ord: clamp(ord + .012, 0, 1),
          sd: Math.round(seed * 3 + i * 17 + j * 7 + (s > 0 ? 3 : 0))
        });
      }
    }
  }

  sh.segs.unshift({ x0:0, y0:0, x1:0, y1:Math.min(topY, -H * P.base) - 4*S,
                    w0:P.tw * S, w1:P.tw * .24 * S, d:L + 1, trunk:true, ord:0, a1:0 });

  toneUp(sh.masses, .04, .92);
  for(const m of sh.masses){ m.grow = .05 + rnd(m.sd + 9) * .13; m.r *= .86 + rnd(m.sd + 21) * .30; }

  if(P.twist || P.feather){                       // 龙柏 / 水杉：加一点针叶质感
    for(const sg of sh.segs){
      if(sg.trunk) continue;
      for(let j=0;j<2;j++){
        sh.leaves.push({
          x: sg.x0 + (sg.x1 - sg.x0) * (.35 + j * .45),
          y: sg.y0 + (sg.y1 - sg.y0) * (.35 + j * .45),
          ang: sg.a1 + (j ? 40 : -40), kind:'needle', k: sg.d * 5 + j,
          s: 3.0 + rnd(sg.ord * 97 + j) * 1.6, tone: .58 + rnd(sg.ord * 31 + j) * .34,
          ord: sg.ord
        });
      }
    }
  }

  const bl = sh.masses.filter((_, i) => i % 2 === 0).map(m => ({ x:m.x, y:m.y, ord:m.ord, k:m.sd }));
  bl.sort((a,b) => b.y - a.y);
  bl.forEach((t,i) => { t.bo = bl.length < 2 ? 0 : i / (bl.length - 1); t.r = 3.6 + rnd(t.k) * 1.6; });
  sh.blooms = bl;

  if(sp.f && sp.f.bare){
    for(const m of sh.masses) m.ord = .88 + clamp(m.ord, 0, 1) * .12;
    for(const l of sh.leaves) l.ord = .88 + clamp(l.ord, 0, 1) * .12;
  }
  return sh;
}

/* ---------- 3. 灌木丛 ---------- */
const SHRUB_TIERS = [
  { t:0.00, n:3, w:0.60, r:1.00 },
  { t:0.32, n:3, w:0.96, r:1.06 },
  { t:0.60, n:2, w:0.74, r:0.94 },
  { t:0.82, n:1, w:0.28, r:0.82 }
];
function shapeShrub(w, seed, sp){
  const P = PP(sp.P);
  const sh = mkShape();
  const S = sizeOf(w); sh.S = S;
  const H = (P.h || 100) * S, W = (P.w || 76) * S;

  sh.segs.push({ x0:0, y0:0, x1:1.2*S, y1:-H * .30, w0:(P.tw || 5) * S, w1:(P.tw || 5) * .45 * S,
                 d:9, trunk:true, ord:0, a1:0 });
  /* 两三条短枝，避免灌木看起来是浮在地上的球 */
  for(let i=0;i<3;i++){
    const side = i % 2 ? 1 : -1;
    const a = side * (18 + i * 9);
    const L = H * (.30 + rnd(seed + i*7) * .22);
    sh.segs.push({ x0:0, y0:-H*.26, x1:Math.sin(DEG(a))*L, y1:-H*.26 - Math.cos(DEG(a))*L,
                   cx:Math.sin(DEG(a*.6))*L*.5, cy:-H*.26 - Math.cos(DEG(a*.6))*L*.5,
                   a1:a, w0:(P.tw||5)*.5*S, d:1, ord:.06 + i*.05 });
  }

  let idx = 0;
  const spot = [];
  SHRUB_TIERS.forEach((T, ti) => {
    for(let j=0;j<T.n;j++){
      const u = T.n < 2 ? 0 : (j / (T.n - 1)) * 2 - 1;
      spot.push({
        x: u * T.w * W * .5 + (rnd(seed + ti*13 + j*7) - .5) * 9 * S,
        y: -H * (.24 + .70 * T.t) + (rnd(seed + ti*5 + j*3) - .5) * 8 * S,
        r: T.r * P.massS * S * W * .37, idx: idx++,
        ord: clamp(.05 + T.t * .74 + (rnd(ti*3 + j) - .5) * .07, 0, .96)
      });
    }
  });
  sh.masses = spot.map(o => ({ x:o.x, y:o.y, r:o.r, ord:o.ord, sd:seed*3 + o.idx*29 }));

  toneUp(sh.masses, .06, .92);
  for(const m of sh.masses){ m.grow = .10 + rnd(m.sd + 9) * .14; m.r *= .86 + rnd(m.sd + 21) * .28; }

  /* 叶片：贴着球面撒一圈，给轮廓一点毛边 */
  const leafN = P.leafN > 5 ? P.leafN : 5;
  for(let i=0;i<sh.masses.length;i++){
    const m = sh.masses[i];
    for(let j=0;j<leafN;j++){
      const a = (j * 360 / leafN) + rnd(i*7 + j*3) * 40;
      sh.leaves.push({
        x: m.x + Math.cos(DEG(a)) * m.r * .92,
        y: m.y + Math.sin(DEG(a)) * m.r * .80,
        ang: a - 90, kind: P.leafKind, k: i*13 + j*5,
        s: (3.2 + rnd(i*11 + j*7) * 1.8) * P.leafS,
        tone: .54 + rnd(i*3 + j*17) * .40,
        ord: clamp(m.ord + .02, 0, 1)
      });
    }
  }

  const bl = [];
  sh.masses.forEach((m,i) => {
    bl.push({ x:m.x, y:m.y, ord:m.ord, k:m.sd });
    if(i % 2 === 0) bl.push({ x:m.x - m.r*.5, y:m.y - m.r*.35, ord:m.ord, k:m.sd + 7 });
  });
  bl.sort((a,b) => b.y - a.y);
  bl.forEach((t,i) => { t.bo = bl.length < 2 ? 0 : i / (bl.length - 1); t.r = 3.6 + rnd(t.k) * 1.6; });
  sh.blooms = bl;

  if(sp.f && sp.f.bare){
    for(const m of sh.masses) m.ord = .88 + clamp(m.ord, 0, 1) * .12;
    for(const l of sh.leaves) l.ord = .88 + clamp(l.ord, 0, 1) * .12;
  }
  return sh;
}

/* ---------- 叶形 ---------- */
function leafPathWorld(x, y, ang, s){
  if(!isFinite(x) || !isFinite(y) || !isFinite(ang) || !isFinite(s)) return '';
  const ca = Math.cos(DEG(ang)), sa = Math.sin(DEG(ang));
  const P = (lx, ly) => `${(x + lx*ca - ly*sa).toFixed(1)},${(y + lx*sa + ly*ca).toFixed(1)}`;
  return `M${P(0,0)}`
       + `C${P(s*.92,-s*.56)} ${P(s*.86,-s*1.58)} ${P(0,-s*2.16)}`
       + `C${P(-s*.86,-s*1.58)} ${P(-s*.92,-s*.56)} ${P(0,0)}Z`;
}
function leafPath(kind, x, y, ang, s){
  if(kind === 'oval' || !kind) return leafPathWorld(x, y, ang, s);
  if(!isFinite(x) || !isFinite(y) || !isFinite(ang) || !isFinite(s)) return '';
  const ca = Math.cos(DEG(ang)), sa = Math.sin(DEG(ang));
  const P = (lx, ly) => `${(x + lx*ca - ly*sa).toFixed(1)},${(y + lx*sa + ly*ca).toFixed(1)}`;
  if(kind === 'fan')                                          // 银杏：小扇子
    return `M${P(0,0)}L${P(-s*1.0,-s*1.40)}Q${P(0,-s*1.92)} ${P(s*1.0,-s*1.40)}Z`;
  if(kind === 'needle')                                       // 针叶
    return `M${P(0,0)}Q${P(s*.36,-s*1.1)} ${P(0,-s*3.0)}Q${P(-s*.36,-s*1.1)} ${P(0,0)}Z`;
  if(kind === 'narrow')                                       // 柳 / 合欢 / 蓝花楹：细长
    return `M${P(0,0)}Q${P(s*.54,-s*.98)} ${P(0,-s*2.8)}Q${P(-s*.54,-s*.98)} ${P(0,0)}Z`;
  if(kind === 'broad')                                        // 梧桐 / 泡桐：大叶
    return `M${P(0,0)}`
         + `C${P(s*1.36,-s*.28)} ${P(s*1.30,-s*1.60)} ${P(0,-s*1.92)}`
         + `C${P(-s*1.30,-s*1.60)} ${P(-s*1.36,-s*.28)} ${P(0,0)}Z`;
  return leafPathWorld(x, y, ang, s);
}
/* 椭圆在绝对坐标里画成路径，方便把几十朵花合并成几个 path */
function ellPath(cx, cy, rx, ry, rot){
  const a = DEG(rot), ca = Math.cos(a), sa = Math.sin(a);
  const x0 = cx + rx*ca, y0 = cy + rx*sa;
  const x1 = cx - rx*ca, y1 = cy - rx*sa;
  return `M${x0.toFixed(1)},${y0.toFixed(1)}`
       + `A${rx.toFixed(2)},${ry.toFixed(2)} ${rot.toFixed(1)} 1 1 ${x1.toFixed(1)},${y1.toFixed(1)}`
       + `A${rx.toFixed(2)},${ry.toFixed(2)} ${rot.toFixed(1)} 1 1 ${x0.toFixed(1)},${y0.toFixed(1)}Z`;
}
/* 圆润的闭合团块，用来堆树冠 */
function blobPath(x, y, r, sd){
  if(!isFinite(x) || !isFinite(y) || !isFinite(r) || r <= 0) return '';
  const N = 7, pts = [];
  for(let i=0;i<N;i++){
    const a = (i/N) * Math.PI * 2 - Math.PI/2;
    const rr = r * (.80 + rnd(sd + i*13) * .44);
    pts.push([x + Math.cos(a)*rr, y + Math.sin(a)*rr*.86]);
  }
  let d = '';
  for(let i=0;i<N;i++){
    const p = pts[i], q = pts[(i+1)%N];
    const mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
    d += (i === 0 ? `M${mx.toFixed(1)},${my.toFixed(1)}` : '')
       + `Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  return d + 'Z';
}

/* ---------- 花型 ---------- */
function flowerPaths(kind, items, color){
  const L = {};
  const put = (fill, d) => { if(d){ (L[fill] = L[fill] || []).push(d); } };
  for(const f of items){
    const r = f.r;
    if(kind === 'cup'){                                  // 玉兰 / 木棉 / 石榴：大杯状
      for(let i=0;i<6;i++){
        const a = i * 60 - 30;
        const wx = f.x + Math.cos(DEG(a-90)) * r * .50;
        const wy = f.y + Math.sin(DEG(a-90)) * r * .50;
        put(i % 2 ? color : '#ffffff', ellPath(wx, wy, r*.40, r*.78, a));
      }
      put('#e8b84a', ellPath(f.x, f.y, r*.22, r*.22, 0));
    }else if(kind === 'ball'){                           // 山茶 / 蜡梅：一团
      put(color, ellPath(f.x, f.y, r*.92, r*.86, 0));
      put('rgba(255,255,255,.55)', ellPath(f.x - r*.24, f.y - r*.26, r*.40, r*.36, 0));
    }else if(kind === 'puff'){                           // 合欢：绒球
      put(color, ellPath(f.x, f.y, r*.70, r*.64, 0));
      for(let i=0;i<9;i++){
        const a = i * 40;
        put('rgba(255,255,255,.85)', ellPath(f.x + Math.cos(DEG(a))*r*.70, f.y + Math.sin(DEG(a))*r*.70, r*.15, r*.15, 0));
      }
    }else if(kind === 'spike'){                          // 丁香 / 刺槐：一串
      const n = 6;
      for(let i=0;i<n;i++){
        const t = i / (n - 1);
        const rr = r * (1 - Math.abs(t - .5) * 1.5) * .52;
        put(i % 2 ? color : '#ffffff',
            ellPath(f.x + (rnd(f.k + i*7) - .5) * r * .34, f.y - r*1.15 + t*r*2.3, rr, rr*.88, 0));
      }
    }else if(kind === 'dot'){                            // 桂花：小米粒
      for(let i=0;i<5;i++){
        const a = i * 72 + 20;
        put(color, ellPath(f.x + Math.cos(DEG(a))*r*.52, f.y + Math.sin(DEG(a))*r*.52, r*.19, r*.19, 0));
      }
    }else{                                               // blossom：五瓣
      for(let i=0;i<5;i++){
        const a = i * 72;
        const wx = f.x + Math.cos(DEG(a-90)) * r * .80;
        const wy = f.y + Math.sin(DEG(a-90)) * r * .80;
        put(i % 2 ? '#ffffff' : color, ellPath(wx, wy, r*.54, r*.66, a));
      }
      put('#f6d365', ellPath(f.x, f.y, r*.27, r*.27, 0));
    }
  }
  return Object.keys(L).map(fill => `<path d="${L[fill].join('')}" fill="${fill}"/>`).join('');
}

/* ---------- 统一下笔 ---------- */
function drawShape(sh, sp, w){
  const col = sp.l || ['#3f7a49','#5ba55f','#a8dd7a'];
  const F = sp.f;
  let bark = '', leaf = '', bloom = '';

  for(const sg of sh.segs){
    if(sg.ord > w + .012) continue;
    if(sg.trunk){
      const { x0, y0, x1, y1, w0, w1 } = sg, h = y0 - y1;
      bark += `<path d="M${(x0-w0/2).toFixed(1)},${y0}`
            + ` C${(x0-w0*.18).toFixed(1)},${(y0-h*.46).toFixed(1)} ${(x1-w1*2.1).toFixed(1)},${(y1+h*.34).toFixed(1)} ${(x1-w1/2).toFixed(1)},${y1}`
            + ` L${(x1+w1/2).toFixed(1)},${y1}`
            + ` C${(x1+w1*2.1).toFixed(1)},${(y1+h*.34).toFixed(1)} ${(x0+w0*.18).toFixed(1)},${(y0-h*.46).toFixed(1)} ${(x0+w0/2).toFixed(1)},${y0} Z"`
            + ` fill="${sp.b}"/>`;
    }else{
      bark += `<path d="M${sg.x0.toFixed(1)},${sg.y0.toFixed(1)} Q${sg.cx.toFixed(1)},${sg.cy.toFixed(1)} ${sg.x1.toFixed(1)},${sg.y1.toFixed(1)}"`
            + ` fill="none" stroke="${sp.b}" stroke-width="${Math.max(.9, sg.w0).toFixed(2)}" stroke-linecap="round"/>`;
    }
  }

  /* 树冠体块（在叶子和枝条之下） */
  const NB = 6, mbuf = [];
  for(let i=0;i<NB;i++) mbuf.push([]);
  for(const m of sh.masses){
    if(m.ord > w + .05) continue;
    const g = clamp((w - m.ord) / m.grow, .25, 1);
    const bi = Math.min(NB-1, Math.floor(clamp(m.tone, 0, 1) * NB));
    const d = blobPath(m.x, m.y, m.r * g, m.sd);
    if(d) mbuf[bi].push(d);
  }
  const mtones = [.02, .15, .28, .41, .54, .68];
  for(let i=0;i<NB;i++){
    if(!mbuf[i].length) continue;
    const fill = rgb(mixc(col[0], col[2], mtones[i]));
    leaf += `<path d="${mbuf[i].join('')}" fill="${fill}"/>`;
  }

  const nLeaf = sh.leaves.length;
  const BUCKETS = 6, buf = [];
  for(let i=0;i<BUCKETS;i++) buf.push([]);
  for(let i=0;i<nLeaf;i++){
    const lf = sh.leaves[i];
    if(lf.ord > w) continue;
    if(lf.stem && w > lf.fade) continue;
    const bi = Math.min(BUCKETS-1, Math.floor(clamp(lf.tone, 0, 1) * BUCKETS));
    buf[bi].push(leafPath(lf.kind, lf.x, lf.y, lf.ang, lf.s));
  }
  const tones = [.34, .50, .66, .80, .92, 1];
  for(let i=0;i<BUCKETS;i++){
    if(!buf[i].length) continue;
    leaf += `<path d="${buf[i].join('')}" fill="${rgb(mixc(col[0], col[2], tones[i]))}"/>`;
  }

  /* 花：先冒花苞，再开，从下往上依次开 */
  if(F){
    const budT  = clamp((w - .30) / (.62 - .30), 0, 1);
    const flowT = clamp((w - .60) / (.86 - .60), 0, 1);
    const bd = [], fd = [];
    for(const t of sh.blooms){
      if(t.ord > w) continue;
      const r = (t.r || 4) * (F.s || 1);
      if(t.bo <= flowT)     fd.push({ x:t.x, y:t.y, r, k:t.k });
      else if(t.bo <= budT) bd.push(t);
    }
    if(bd.length){
      let d = '';
      for(const b of bd) d += ellPath(b.x, b.y, 1.9, 2.6, 0);
      bloom += `<path d="${d}" fill="${F.c}"/>`;
    }
    if(fd.length) bloom += flowerPaths(F.k, fd, F.c);
  }

  return bark + leaf + bloom;
}

/* ---------- 竹丛 ---------- */
function renderBamboo(w, sp, seed){
  const P = PP(sp.P);
  const S = sizeOf(w);
  const H = (P.h || 154) * S;
  const n = Math.max(1, Math.round(1 + clamp(w, 0, 1) * ((P.n || 5) - 1)));
  const D = P.l || ['#4a8a3a','#63a545','#96c765'];
  let out = '';
  for(let i=0;i<n;i++){
    const bx = (i - (n-1)/2) * 13.5 * S;
    const hh = H * (.60 + rnd(seed + i*13) * .40);
    const lean = (rnd(seed + i*3) - .5) * 22;
    const c = (i % 2 ? D[1] : D[0]);
    const Pt = t => [bx + lean*t*t*.9, -hh*t];
    out += `<path d="M${bx.toFixed(1)},0 Q${Pt(.55)[0].toFixed(1)},${Pt(.55)[1].toFixed(1)} ${(bx+lean).toFixed(1)},${(-hh).toFixed(1)}"`
         + ` fill="none" stroke="${c}" stroke-width="${((P.tw || 7.4)*S).toFixed(1)}" stroke-linecap="round"/>`;
    for(let j=1;j<=4;j++){
      const p = Pt(j/5);
      out += `<path d="M${(p[0]-3.4*S).toFixed(1)},${p[1].toFixed(1)} L${(p[0]+3.4*S).toFixed(1)},${p[1].toFixed(1)}"`
           + ` stroke="rgba(22,44,16,.32)" stroke-width="${(1.15*S).toFixed(2)}"/>`;
    }
    for(let j=0;j<3;j++){
      const side = ((i + j) % 2) ? 1 : -1;
      const p = Pt(.60 + j*.17);
      const lc = (j % 2 ? D[2] : D[1]);
      const lx = p[0] + side * 15 * S;
      out += `<ellipse cx="${lx.toFixed(1)}" cy="${p[1].toFixed(1)}" rx="${((P.leafLen || 23)*S).toFixed(1)}" ry="${((P.leafW || 5.4)*S).toFixed(1)}"`
           + ` transform="rotate(${(side*(28 + j*9)).toFixed(1)} ${lx.toFixed(1)} ${p[1].toFixed(1)})" fill="${lc}"/>`;
    }
    const tp = Pt(1);
    out += `<ellipse cx="${tp[0].toFixed(1)}" cy="${(tp[1] - 2.5*S).toFixed(1)}" rx="${(3.2*S).toFixed(1)}" ry="${(6.5*S).toFixed(1)}" fill="${D[2]}"/>`;
  }
  return out;
}

function renderAny(spIdx, w, seed){
  if(!(w > 0)) return '';
  const N = SPECIES.length;
  const i = ((spIdx % N) + N) % N;
  const sp = SPECIES[i];
  const a = sp.a;
  const inner = (a === 'bamboo') ? renderBamboo(w, sp, seed)
    : drawShape(
        (a === 'conifer' || a === 'column') ? shapeConifer(w, seed, sp)
        : (a === 'shrub')                   ? shapeShrub(w, seed, sp)
        :                                     shapeSpread(w, seed, sp),
        sp, w);
  const k = fitOf(i);
  return k === 1 ? inner : `<g transform="scale(${k})">${inner}</g>`;
}


return { SPECIES: SPECIES, FIT: FIT, fitOf: fitOf, renderAny: renderAny };

/* ============================================================
   工具
   ============================================================ */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO() { return isoOf(new Date()); }
function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function fmtDate(iso) {
  var d = parseISO(iso);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()];
}

/* ============================================================
   数据
   只存「今天有没有做」和「累计多少天」。
   不存日期、不存历史、不存时长，没有日历可回看。
   ============================================================ */
var KEY = 'jianchi-v2';
var OLD_KEY = 'jianchi-v1';
var TREE_CYCLE = 7;

var PALETTE = {
  green:  { bg: '#DDEBCB', c2: '#EDF5E1', deep: '#8FB55C' },
  purple: { bg: '#DED8EF', c2: '#EBE8F7', deep: '#9C8FD0' },
  blue:   { bg: '#CFE0EF', c2: '#E1EDF6', deep: '#7FA8C9' },
  pink:   { bg: '#F3DCE2', c2: '#FAEFF2', deep: '#CE8CA0' },
  orange: { bg: '#F7E4CE', c2: '#FCF2E4', deep: '#D0A26A' },
  teal:   { bg: '#CFE7E2', c2: '#E4F2EF', deep: '#79B3A8' },
  yellow: { bg: '#F5EEC9', c2: '#FAF6E1', deep: '#C9B85E' },
  gray:   { bg: '#E6E6E2', c2: '#F1F1EE', deep: '#A3A39B' }
};
var COLORS = Object.keys(PALETTE);
var ICONS = ['💪','🛡️','🏃','🧘','💧','🥗','📝','🎯','🎸','🌙','☀️','🚭','🍎','🧹','💊','📚'];

var DEFAULT_HABITS = [
  { id: 'fit',   name: '健身', icon: '💪', color: 'purple', type: 'check',   total: 0, sort: 0 },
  { id: 'nofap', name: '戒撸', icon: '🛡️', color: 'blue',   type: 'abstain', total: 0, sort: 1 }
];

function defaultHabits() {
  return DEFAULT_HABITS.map(function (h) {
    return { id: h.id, name: h.name, icon: h.icon, color: h.color, type: h.type, total: 0, sort: h.sort };
  });
}
function newState() {
  var t = todayISO();
  return {
    version: 2,
    habits: defaultHabits(),
    today: t,
    checks: {},
    fullDays: 0,
    fullCounted: false,
    grown: [],
    settings: { createdAt: t }
  };
}
function normalizeState(d) {
  if (!d || !Array.isArray(d.habits)) return null;
  d.version = 2;
  if (!d.today) d.today = todayISO();
  if (!d.checks || typeof d.checks !== 'object') d.checks = {};
  d.fullDays = Math.max(0, parseInt(d.fullDays, 10) || 0);
  d.fullCounted = !!d.fullCounted;
  if (!Array.isArray(d.grown)) d.grown = [];
  d.grown = d.grown.filter(function (g) {
    return g && typeof g.sp === 'number' && g.sp >= 0 && g.sp < 50;
  }).map(function (g) {
    return {
      sp: g.sp,
      day: Math.max(0, parseInt(g.day, 10) || 0),
      date: typeof g.date === 'string' ? g.date : ''
    };
  });
  if (!d.settings || typeof d.settings !== 'object') d.settings = { createdAt: d.today };
  d.habits.forEach(function (h, i) {
    h.id = h.id || ('h' + i);
    h.name = h.name || '习惯';
    h.icon = h.icon || '🎯';
    h.color = PALETTE[h.color] ? h.color : 'green';
    h.type = h.type === 'abstain' ? 'abstain' : 'check';
    h.total = Math.max(0, parseInt(h.total, 10) || 0);
    h.sort = typeof h.sort === 'number' ? h.sort : i;
  });
  d.habits.sort(function (a, b) { return a.sort - b.sort; });
  return d;
}

/* 旧版数据迁移：只带走「累计天数」和「今天」，不带走任何日期。
   英语习惯在这里被删掉；全勤天数按旧版全部习惯（含英语）计算，
   这样删掉英语不会把以前没做英语的日子突然算成全勤。 */
function oldDone(h, r) {
  if (!r) return false;
  if (h.type === 'abstain') return r.status === 'kept';
  return r.status !== 'rest' && r.status !== 'leave' && r.status !== 'relapse';
}
function migrateV1(old) {
  if (!old || !Array.isArray(old.habits) || !old.records) return null;
  var oldHabits = old.habits.slice();
  var newHabits = oldHabits.filter(function (h) {
    return h.id !== 'en' && h.name !== '英语';
  }).map(function (h) {
    return {
      id: h.id,
      name: h.name || '习惯',
      icon: h.icon || '🎯',
      color: PALETTE[h.color] ? h.color : 'green',
      type: h.type === 'abstain' ? 'abstain' : 'check',
      total: 0,
      sort: 0
    };
  });
  newHabits.forEach(function (h, i) {
    h.sort = i;
    var log = old.records[h.id] || {};
    var n = 0;
    for (var d in log) if (oldDone(h, log[d])) n++;
    h.total = n;
  });

  var dates = {};
  oldHabits.forEach(function (h) {
    var log = old.records[h.id] || {};
    for (var d in log) dates[d] = 1;
  });
  var fullDays = 0;
  Object.keys(dates).forEach(function (d) {
    var ok = oldHabits.length > 0 && oldHabits.every(function (h) {
      return oldDone(h, (old.records[h.id] || {})[d]);
    });
    if (ok) fullDays++;
  });
  /* 旧版只有英语一个习惯时，删掉英语就没有任何习惯了，
     这时不该把以前的全勤算到一棵没有习惯的树上。 */
  if (!newHabits.length) fullDays = 0;

  var t = todayISO();
  var checks = {};
  newHabits.forEach(function (h) {
    var r = (old.records[h.id] || {})[t];
    if (r && oldDone(h, r)) checks[h.id] = true;
  });
  var fullCounted = oldHabits.length > 0 && oldHabits.every(function (h) {
    return oldDone(h, (old.records[h.id] || {})[t]);
  });
  if (!newHabits.length) fullCounted = false;

  return {
    version: 2,
    habits: newHabits,
    today: t,
    checks: checks,
    fullDays: fullDays,
    fullCounted: fullCounted,
    grown: [],
    settings: {
      createdAt: (old.settings && old.settings.createdAt) || t,
      migratedFromV1: true
    }
  };
}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = normalizeState(JSON.parse(raw));
      if (d) return d;
    }
    var oldRaw = localStorage.getItem(OLD_KEY);
    if (oldRaw) {
      var migrated = normalizeState(migrateV1(JSON.parse(oldRaw)));
      if (migrated) return migrated;
    }
  } catch (e) {}
  return newState();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('保存失败，存储空间可能已满'); }
}

var S = load();
save();
if (S.settings && S.settings.migratedFromV1) {
  try { localStorage.removeItem(OLD_KEY); } catch (e) {}
}
syncFullDay();
save();

function activeHabits() {
  return S.habits.slice().sort(function (a, b) { return a.sort - b.sort; });
}
function habitById(id) {
  return S.habits.filter(function (h) { return h.id === id; })[0];
}
function isChecked(h) { return !!S.checks[h.id]; }
function allDone() {
  var hs = activeHabits();
  return hs.length > 0 && hs.every(isChecked);
}
function remainingCount() {
  return activeHabits().filter(function (h) { return !isChecked(h); }).length;
}
/* 今天是否「全部完成」决定全勤 +1 / -1。
   漏打一整天什么也不会发生：累计不变，树只是暂停。
   长成的树会记进 S.grown —— 只增不减，撤销今天不会把树收回去。 */
function syncFullDay() {
  var all = allDone();
  if (all && !S.fullCounted) { S.fullDays++; S.fullCounted = true; recordGrown(); return 1; }
  if (!all && S.fullCounted) { S.fullDays = Math.max(0, S.fullDays - 1); S.fullCounted = false; return -1; }
  return 0;
}
/* 累计天数刚好走到 7 的整数倍时，把这一棵记下来。
   同一棵不会记两次：按「第几次长成」去重。 */
function recordGrown() {
  var n = S.fullDays;
  if (n <= 0 || n % TREE_CYCLE !== 0) return;
  var k = n / TREE_CYCLE;                 // 这是第 k 棵
  if (S.grown.length >= k) return;        // 已经记过
  S.grown.push({
    sp: speciesIdxAt(k - 1),
    day: TREE_CYCLE,
    date: todayISO()
  });
}
/* 换了一天：只清掉「今天做没做」，累计天数原样保留。 */
function ensureToday() {
  var t = todayISO();
  if (S.today !== t) {
    S.today = t;
    S.checks = {};
    S.fullCounted = false;
    save();
    return true;
  }
  return false;
}

/* ============================================================
   树的推导：累计全勤天数 → 第几棵 / 长了几天
   ============================================================ */
var SPECIES = TREEW.SPECIES;
var TREE_ORDER = [
  21,  2, 41,  5, 13, 49, 10, 15,  1, 26,
   7, 16, 29, 45, 39, 12,  4, 22, 46,  9,
  19,  6, 43, 17,  8, 47, 23,  3, 27, 44,
  20, 33, 18, 31, 42, 24, 32, 48, 38, 11,
  34, 25, 30, 35, 14, 36, 40, 37, 28,  0
];
function speciesIdxAt(k) {
  var L = TREE_ORDER.length;
  return TREE_ORDER[((k % L) + L) % L];
}
function treeSeed(k) { return 137 * k + 29; }
function treeState() {
  var n = S.fullDays;
  var grown = Math.floor(n / TREE_CYCLE);
  var cur = n % TREE_CYCLE;
  var idx, day, full;
  if (n === 0) {
    idx = -1; day = 0; full = false;
  } else if (cur === 0) {
    idx = grown - 1; day = TREE_CYCLE; full = true;
  } else {
    idx = grown; day = cur; full = false;
  }
  return {
    n: n, grown: grown, cur: cur, idx: idx, day: day, full: full,
    spIdx: idx < 0 ? -1 : speciesIdxAt(idx)
  };
}
function treeSVG(spIdx, w, k) {
  if (spIdx < 0) return '';
  return '<svg viewBox="-95 -175 190 190" aria-hidden="true">' +
    TREEW.renderAny(spIdx, Math.max(.04, Math.min(1, w)), treeSeed(k)) + '</svg>';
}
var SPROUT_SVG =
  '<svg viewBox="0 0 120 140" aria-hidden="true">' +
  '<path d="M60 128 C60 98 60 76 60 54" fill="none" stroke="#8FB55C" stroke-width="4.2" stroke-linecap="round"/>' +
  '<path d="M60 76 C38 72 28 54 31 39 C49 42 60 57 60 76Z" fill="#BEDD94"/>' +
  '<path d="M60 63 C82 59 93 41 90 26 C71 29 60 44 60 63Z" fill="#8FB55C"/>' +
  '<path d="M42 128 H78" stroke="#D8D8D2" stroke-width="3" stroke-linecap="round"/>' +
  '</svg>';

/* ============================================================
   今日页
   ============================================================ */
function renderHero() {
  var T = treeState();
  var hs = activeHabits();
  var all = allDone();
  var C = 2 * Math.PI * 112;
  var w = T.spIdx < 0 ? 0 : T.day / TREE_CYCLE;
  /* 树的画法从 28% 起步：第一天就是一棵有叶子的小树，
     不会因为进度低而只剩几根枝条。 */
  var artW = T.spIdx < 0 ? 0 : 0.28 + 0.72 * w;
  var ring = '<svg class="ring2" viewBox="0 0 252 252" aria-hidden="true">' +
    '<circle class="rbg" cx="126" cy="126" r="112"></circle>' +
    '<circle class="rfg" cx="126" cy="126" r="112" stroke-dasharray="' + C.toFixed(1) +
    '" stroke-dashoffset="' + (C * (1 - w)).toFixed(1) + '"></circle></svg>';
  var art = T.spIdx < 0
    ? '<div class="sprout">' + SPROUT_SVG + '</div>'
    : '<div class="tree">' + treeSVG(T.spIdx, artW, Math.max(0, T.idx)) + '</div>';

  var main, sub, subCls = '';
  if (T.spIdx < 0) {
    main = '还没有树';
    sub = hs.length
      ? '今天把 ' + hs.length + ' 个习惯都完成，就会种下第一棵'
      : '先添加一个习惯';
  } else if (T.full) {
    main = '🌸 ' + esc(SPECIES[T.spIdx].n) + '长成了';
    if (!hs.length) { sub = '先添加一个习惯'; }
    else if (all) { sub = '今天已打满 · 明天开始种下一棵'; subCls = ' done'; }
    else { sub = '新树先停着 · 今天还有 ' + remainingCount() + ' 个没记'; subCls = ' paused'; }
  } else {
    main = '第 ' + T.day + ' / ' + TREE_CYCLE + ' 天 · ' + esc(SPECIES[T.spIdx].n);
    if (!hs.length) { sub = '先添加一个习惯'; }
    else if (all) { sub = '今天已打满 · 树又长了一天'; subCls = ' done'; }
    else { sub = '树先停着 · 今天还有 ' + remainingCount() + ' 个没记'; subCls = ' paused'; }
  }

  return '<div class="hero">' +
    '<div class="ring">' + ring + '<div class="halo"></div>' + art + '</div>' +
    '<div class="hmain">' + main + '</div>' +
    '<div class="hsub' + subCls + '">' + sub + '</div>' +
    '<div class="hcount">已经 <b>' + T.n + '</b> 天</div>' +
    '</div>';
}

function renderCard(h, i) {
  var p = PALETTE[h.color] || PALETTE.green;
  var done = isChecked(h);
  var style = '--c1:' + p.bg + ';--c2:' + p.c2 + ';--deep:' + p.deep;
  var q = h.type === 'abstain' ? '今天守住了吗？' : '今天' + esc(h.name) + '了吗？';
  var act = h.type === 'abstain' ? '守住了' : '完成了';
  var doneAct = h.type === 'abstain' ? '已守住' : '已完成';
  var hint = done
    ? (h.type === 'abstain' ? '已守住 · 再点一下可撤销' : '已完成 · 再点一下可撤销')
    : '轻点一下，记下今天';
  return '<div class="card' + (i % 2 === 1 ? ' rr' : '') + '" style="' + style + '">' +
    '<div class="ctop">' +
      '<div class="ic">' + h.icon + '</div>' +
      '<div class="cname">' + esc(h.name) + '</div>' +
      '<div class="total">' + h.total + '<em> 天</em></div>' +
    '</div>' +
    '<div class="q">' + q + '</div>' +
    '<button class="do' + (done ? ' done' : '') + '" data-act="toggle" data-hid="' + h.id + '">' +
      '<span class="mark">' + (done ? '✓' : '○') + '</span>' + (done ? doneAct : act) +
    '</button>' +
    '<div class="hint' + (done ? ' done' : '') + '">' + hint + '</div>' +
  '</div>';
}

function render() {
  ensureToday();
  var hs = activeHabits();
  var html = '<div class="top">' +
    '<div></div>' +
    '<div class="tmain"><h1 class="h1">今天</h1><p class="date">' + fmtDate(S.today) + '</p></div>' +
    '<button class="gear" data-act="settings" aria-label="设置">⋯</button>' +
    '</div>';
  html += renderHero();
  if (!hs.length) {
    html += '<div class="empty">还没有习惯<br><button class="pbtn" data-act="addHabit">添加一个</button></div>';
  } else {
    html += '<div class="cards">' + hs.map(renderCard).join('') + '</div>';
  }
  $('#app').innerHTML = html;
}

function toggleHabit(hid) {
  ensureToday();
  var h = habitById(hid);
  if (!h) return;
  var was = isChecked(h);
  if (was) {
    delete S.checks[h.id];
    h.total = Math.max(0, h.total - 1);
  } else {
    S.checks[h.id] = true;
    h.total = (h.total || 0) + 1;
  }
  var delta = syncFullDay();
  save();
  render();
  if (!was && delta > 0) {
    var T = treeState();
    if (T.full) toast('🌸 ' + SPECIES[T.spIdx].n + '长成了');
    else toast('今天全部完成 · 树又长了一天');
    pulseHero();
  } else if (!was) {
    toast('已记下 · 累计 ' + h.total + ' 天');
  } else {
    toast('已撤销');
  }
}
function pulseHero() {
  var r = $('.ring');
  if (!r) return;
  r.classList.remove('pop');
  void r.offsetWidth;
  r.classList.add('pop');
  setTimeout(function () { r.classList.remove('pop'); }, 520);
}

/* ============================================================
   设置
   ============================================================ */
function openSettings() {
  var hs = activeHabits();
  var rows = hs.map(function (h) {
    var p = PALETTE[h.color] || PALETTE.green;
    return '<button class="lrow" data-act="editHabit" data-hid="' + h.id + '">' +
      '<span class="lico" style="--cardbg:' + p.bg + '">' + h.icon + '</span>' +
      '<span class="lmain"><span class="lname">' + esc(h.name) + '</span>' +
      '<span class="lsub">' + (h.type === 'abstain' ? '戒断型' : '完成型') + ' · 累计 ' + h.total + ' 天</span></span>' +
      '<span class="larr">›</span></button>';
  }).join('');
  if (!rows) rows = '<div class="lrow"><span class="lmain"><span class="lsub">还没有习惯</span></span></div>';

  var html = '<div class="grip"></div>' +
    '<div class="shtitle">设置</div>' +
    '<div class="shsub">只记录今天，不保存可回看的历史。</div>' +
    '<div class="sect2">习惯</div>' +
    '<div class="list">' + rows + '</div>' +
    '<button class="addbtn" data-act="addHabit">＋ 添加习惯</button>' +
    '<div class="sect2">长成的树</div>' +
    '<button class="lrow" data-act="grown"><span class="lmain"><span class="lname">已经种出来的树</span>' +
      '<span class="lsub">' + (S.grown.length ? S.grown.length + ' 棵' : '还没有') + '</span></span>' +
      '<span class="larr">›</span></button>' +
    '<div class="sect2">数据</div>' +
    '<button class="danger" data-act="clearAll">清空所有数据</button>' +
    '<div class="foot">v2.0 · 数据只保存在这台设备<br>漏打只会暂停，不会清零</div>';

  openSheet(html, function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'editHabit') { openEditor(el.dataset.hid); return; }
    if (el.dataset.act === 'addHabit') { openEditor(null); return; }
    if (el.dataset.act === 'grown') { openGrown(); return; }
    if (el.dataset.act === 'clearAll') { clearAll(); return; }
  });
}

var editor = { id: null, name: '', icon: '🎯', color: 'green', type: 'check' };
function freeColor() {
  var used = S.habits.map(function (h) { return h.color; });
  for (var i = 0; i < COLORS.length; i++) if (used.indexOf(COLORS[i]) < 0) return COLORS[i];
  return COLORS[S.habits.length % COLORS.length];
}
function openEditor(hid) {
  var h = hid ? habitById(hid) : null;
  editor = {
    id: h ? h.id : null,
    name: h ? h.name : '',
    icon: h ? h.icon : '🎯',
    color: h ? h.color : freeColor(),
    type: h ? h.type : 'check'
  };
  var icons = ICONS.map(function (ic) {
    return '<button data-icon="' + ic + '"' + (editor.icon === ic ? ' class="on"' : '') + '>' + ic + '</button>';
  }).join('');
  var colors = COLORS.map(function (c) {
    return '<button data-color="' + c + '"' + (editor.color === c ? ' class="on"' : '') +
      '" style="--pc:' + PALETTE[c].bg + '" aria-label="' + c + '"></button>';
  }).join('');

  var html = '<div class="grip"></div>' +
    '<div class="shtitle">' + (h ? '编辑习惯' : '新习惯') + '</div>' +
    '<div class="shsub">一个习惯，一个问题，一个按钮。</div>' +
    '<div class="field"><label>名称</label>' +
      '<input id="edName" type="text" maxlength="12" placeholder="比如：健身" value="' + esc(editor.name) + '"></div>' +
    '<div class="field"><label>类型</label><div class="typecards">' +
      '<button class="typecard' + (editor.type === 'check' ? ' on' : '') + '" data-type="check"><b>完成型</b>今天做了就算完成</button>' +
      '<button class="typecard' + (editor.type === 'abstain' ? ' on' : '') + '" data-type="abstain"><b>戒断型</b>今天守住了就算完成</button>' +
    '</div></div>' +
    '<div class="field"><label>图标</label><div class="picker" id="edIcons">' + icons + '</div></div>' +
    '<div class="field"><label>颜色</label><div class="picker col" id="edColors">' + colors + '</div></div>' +
    '<div class="pfoot">' +
      '<button class="pbtn" data-act="saveHabit">保存</button>' +
      (h ? '<button class="sbtn" data-act="delHabit">删除这个习惯</button>' : '') +
      '<button class="sbtn" data-close="1">取消</button>' +
    '</div>';

  openSheet(html, function (e, root) {
    var el = e.target.closest('[data-act]');
    if (el) {
      if (el.dataset.act === 'saveHabit') { saveEditor(); return; }
      if (el.dataset.act === 'delHabit') { deleteHabit(); return; }
    }
    var tp = e.target.closest('[data-type]');
    if (tp) {
      editor.type = tp.dataset.type;
      $$('.typecard', root).forEach(function (b) { b.classList.toggle('on', b.dataset.type === editor.type); });
      return;
    }
    var ic = e.target.closest('[data-icon]');
    if (ic) {
      editor.icon = ic.dataset.icon;
      $$('#edIcons button', root).forEach(function (b) { b.classList.toggle('on', b.dataset.icon === editor.icon); });
      return;
    }
    var co = e.target.closest('[data-color]');
    if (co) {
      editor.color = co.dataset.color;
      $$('#edColors button', root).forEach(function (b) { b.classList.toggle('on', b.dataset.color === editor.color); });
      return;
    }
  }, function (root) {
    var name = $('#edName', root);
    if (name) {
      name.value = editor.name;
      name.addEventListener('input', function () { editor.name = name.value; });
      if (!editor.id) setTimeout(function () { try { name.focus(); } catch (e) {} }, 360);
    }
  });
}

function saveEditor() {
  var name = ($('#edName') && $('#edName').value || '').trim();
  if (!name) { toast('先给习惯起个名字'); return; }
  if (editor.id) {
    var h = habitById(editor.id);
    if (!h) return;
    h.name = name;
    h.icon = editor.icon;
    h.color = editor.color;
    h.type = editor.type;
  } else {
    S.habits.push({
      id: 'h' + Date.now().toString(36),
      name: name,
      icon: editor.icon,
      color: editor.color,
      type: editor.type,
      total: 0,
      sort: S.habits.length
    });
  }
  syncFullDay();
  save();
  closeSheet();
  render();
  toast(editor.id ? '已保存' : '已添加');
}

function deleteHabit() {
  var h = habitById(editor.id);
  if (!h) return;
  confirmDlg('删除「' + esc(h.name) + '」？',
    '这个习惯和它的累计天数会被删除，无法恢复。',
    '删除', function () {
      S.habits = S.habits.filter(function (x) { return x.id !== h.id; });
      delete S.checks[h.id];
      syncFullDay();
      save();
      closeSheet();
      render();
      toast('已删除');
    }, true);
}

function clearAll() {
  confirmDlg('清空所有数据？',
    '所有习惯和累计天数都会消失，无法恢复。',
    '清空', function () {
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem(OLD_KEY);
      } catch (e) {}
      S = newState();
      save();
      closeSheet();
      render();
      toast('已清空');
    }, true);
}

/* ============================================================
   长成的树 · 总览
   只显示已经长成的，不显示总数、不显示未获得的空位。
   这是「我有什么」，不是「我缺什么」。
   ============================================================ */
function openGrown() {
  var list = (S.grown || []).slice().reverse();   // 最近长成的排前面
  var body;
  if (!list.length) {
    body = '<div class="gempty">还没有长成的树<br>慢慢来，它自己会长</div>';
  } else {
    body = '<div class="ggrid">' + list.map(function (g, i) {
      return '<div class="gcard">' +
        '<svg viewBox="-95 -175 190 190" aria-hidden="true">' +
          TREEW.renderAny(g.sp, 1, 137 * (list.length - i) + 29) +
        '</svg>' +
        '<div class="gname">' + esc(SPECIES[g.sp].n) + '</div>' +
        (g.date ? '<div class="gdate">' + esc(fmtDate(g.date).replace(' ', ' · ')) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }

  openSheet(
    '<div class="grip"></div>' +
    '<div class="shtitle">长成的树</div>' +
    '<div class="shsub">' + (list.length ? '这些是你已经种出来的。' : '') + '</div>' +
    body,
    null, null
  );
}

var sheetTimer;
function openSheet(inner, onEvent, onInit) {
  clearTimeout(sheetTimer);
  var root = $('#sheetRoot');
  root.innerHTML = '<div class="mask" data-close="1"></div><div class="sheet">' + inner + '</div>';
  var sh = $('.sheet', root), mask = $('.mask', root);
  void sh.offsetHeight;
  sh.classList.add('in');
  mask.classList.add('in');
  root.onclick = function (e) {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    if (onEvent) onEvent(e, root);
  };
  if (onInit) onInit(root);
}
function closeSheet() {
  var root = $('#sheetRoot');
  var sh = $('.sheet', root), mask = $('.mask', root);
  if (!sh) { root.innerHTML = ''; root.onclick = null; return; }
  sh.classList.remove('in');
  mask.classList.remove('in');
  clearTimeout(sheetTimer);
  sheetTimer = setTimeout(function () {
    root.innerHTML = '';
    root.onclick = null;
  }, 340);
}

function confirmDlg(title, body, okText, onOk, danger) {
  var wrap = document.createElement('div');
  wrap.className = 'dlgwrap';
  wrap.innerHTML = '<div class="dlg"><h3>' + esc(title) + '</h3><p>' + body + '</p>' +
    '<div class="dacts"><button data-close="1">取消</button>' +
    '<button class="' + (danger ? 'danger' : 'pbtn') + '" data-ok="1">' + esc(okText) + '</button></div></div>';
  document.body.appendChild(wrap);
  requestAnimationFrame(function () { wrap.classList.add('show'); });
  wrap.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) close();
    if (e.target.closest('[data-ok]')) { close(); onOk(); }
  });
  function close() {
    wrap.classList.remove('show');
    setTimeout(function () { wrap.remove(); }, 220);
  }
}

var toastTimer;
function toast(msg) {
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}

/* ============================================================
   事件
   ============================================================ */
$('#app').addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  if (act === 'toggle') { toggleHabit(el.dataset.hid); return; }
  if (act === 'settings') { openSettings(); return; }
  if (act === 'addHabit') { openEditor(null); return; }
});

document.addEventListener('visibilitychange', function () {
  if (!document.hidden) render();
});
window.addEventListener('focus', function () { render(); });

render();

/* 离线支持 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
